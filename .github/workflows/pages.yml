name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Đồng thời cập nhật Cloudflare Pages (clowo.pages.dev) cho trùng nội dung docs/.
  # Project "clowo" KHÔNG liên kết Git (cập nhật thủ công) → job này giữ 2 bản đồng bộ mỗi lần push.
  # Cần 2 secret: CLOUDFLARE_API_TOKEN (token quyền Cloudflare Pages:Edit) và CLOUDFLARE_ACCOUNT_ID.
  deploy-cloudflare:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Chưa đặt 2 secret → job chỉ cảnh báo và bỏ qua, workflow vẫn xanh. Có secret là tự động deploy từ lần push tiếp.
      - name: Check Cloudflare secrets
        id: cfcheck
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Chưa đặt CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — bỏ qua deploy Cloudflare Pages (GitHub Pages vẫn deploy bình thường)."
            echo "missing=1" >> "$GITHUB_OUTPUT"
          else
            echo "missing=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy docs/ to Cloudflare Pages (clowo)
        if: steps.cfcheck.outputs.missing == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy ./docs --project-name clowo --branch main
