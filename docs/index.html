<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Bảo mật: chặn script/ảnh/kết nối từ nguồn lạ. Bỏ dòng này nếu trang lỗi hiển thị. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self' https://discord.com https://clowo-locks.clowo.workers.dev; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<title>Clowo — Bot Discord đa năng</title>
<style>
:root{
  --blur:#5865f2;
  --txt:#1e1f24;
  --mut:#5c5f66;
  --line:rgba(30,31,36,.12);
  --glass:rgba(255,255,255,.5);
  --glass-strong:rgba(255,255,255,.78);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
  color:var(--txt);
  background:#fff;
}
body::before{
  content:'';
  position:fixed;inset:0;z-index:-2;
  background:url('assets/hero.png') center/cover fixed no-repeat;
  filter:saturate(1.05);
}
body::after{
  content:'';
  position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,.45) 55%,rgba(255,255,255,.72) 100%);
}
a{text-decoration:none}

/* ─── Landing ─── */
.hero{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
  gap:26px;
}
.login-wrap{position:relative;margin-top:10px}

.login-btn{
  font-family:inherit;cursor:pointer;font-size:1.18rem;font-weight:700;
  color:#22232a;border:1px solid rgba(255,255,255,.6);
  border-radius:18px;padding:18px 58px;letter-spacing:.3px;
  background:rgba(255,255,255,.28);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 16px 40px rgba(0,0,0,.18);
  transition:transform .18s,box-shadow .18s,background .18s;
}
.login-btn:hover{transform:translateY(-2px) scale(1.02);background:rgba(255,255,255,.4);box-shadow:0 20px 48px rgba(0,0,0,.22)}
.login-btn .caret{font-size:.75em;margin-left:8px;transition:transform .2s}
.login-btn.open .caret{transform:rotate(180deg)}

.dd{
  position:absolute;top:calc(100% + 12px);left:50%;
  width:340px;max-width:92vw;
  border-radius:18px;padding:12px;
  background:var(--glass-strong);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 26px 60px rgba(0,0,0,.22);
  opacity:0;visibility:hidden;transform:translateX(-50%) translateY(-10px) scale(.97);
  transition:opacity .22s,transform .22s,visibility .22s;
  z-index:50;
  text-align:left;
}
.dd.open{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1)}
.dd-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:6px 8px 8px}
.acct-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  transition:background .15s;
}
.acct-row:hover{background:rgba(30,31,36,.05)}
.acct-row img{width:38px;height:38px;border-radius:50%;background:#eee}
.acct-meta{flex:1;min-width:0}
.acct-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-sub{font-size:.72rem;color:var(--mut)}
.unlink-btn{
  cursor:pointer;border:none;background:transparent;color:var(--mut);
  font-size:.72rem;padding:5px 8px;border-radius:8px;transition:all .15s;
}
.unlink-btn:hover{background:rgba(239,68,68,.12);color:#ef4444}
.link-btn{
  cursor:pointer;width:100%;margin-top:8px;border:none;border-radius:12px;
  padding:12px;font-family:inherit;font-size:.92rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#5865f2,#3f4ac0);
  box-shadow:0 8px 20px rgba(88,101,242,.4);
  transition:transform .16s,box-shadow .16s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.link-btn:hover{transform:translateY(-1px)}
.link-btn.danger{background:linear-gradient(135deg,#e5484d,#b32a2f);box-shadow:0 8px 20px rgba(229,72,77,.32);font-size:.8rem;padding:10px}
.dd-opt{display:flex;align-items:center;gap:8px;padding:8px 6px 2px;font-size:.76rem;color:var(--mut);cursor:pointer;line-height:1.3}
.login-err{font-size:.78rem;color:#ef4444;padding:2px 8px;display:none}
.dd-empty{padding:16px;text-align:center;color:var(--mut);font-size:.86rem}
.dd-head{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:8px 8px 6px;margin-top:4px}
.guild-row{display:flex;align-items:center;gap:10px}
.guild-row.disabled{opacity:.62;cursor:not-allowed}
.lock-toggle{flex:none;margin-left:auto;border:none;padding:0;background:none;cursor:pointer;color:#94a3b8;line-height:0}
.lock-toggle.off{opacity:.5;cursor:not-allowed}
.lt-track{position:relative;display:block;width:54px;height:22px;border-radius:11px;box-sizing:border-box;background:rgba(30,31,36,.08);border:1px solid rgba(30,31,36,.14);transition:background .26s ease,border-color .26s ease}
.lock-toggle.on .lt-track{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3)}
.lt-i{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;pointer-events:none;line-height:0}
.lt-i svg{width:12px;height:12px;display:block}
.lt-i-close{left:5px;opacity:.35}
.lt-i-open{right:5px;opacity:.35}
.lock-toggle.on .lt-i-close{opacity:1;color:#ef4444}
.lock-toggle.on .lt-i-open{opacity:.3}
.lock-toggle:not(.on) .lt-i-open{opacity:1;color:#22c55e}
.lock-toggle:not(.on) .lt-i-close{opacity:.3}
.lt-thumb{position:absolute;top:50%;left:2px;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .26s cubic-bezier(.22,1,.36,1)}
.lock-toggle.on .lt-thumb{transform:translateX(32px)}
.hero-foot{position:absolute;bottom:18px;font-size:.78rem;color:rgba(30,31,36,.55)}

/* ─── Views ─── */
.view{position:relative}
.view.active{animation:viewIn .45s cubic-bezier(.22,1,.36,1) both}
.view.active>*{animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both}
.view.active>*:nth-child(1){animation-delay:.04s}
.view.active>*:nth-child(2){animation-delay:.12s}
.view.active>*:nth-child(3){animation-delay:.2s}
.view.active>*:nth-child(4){animation-delay:.28s}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ─── Góc phải: chips tài khoản/nhóm + pill Member/Admin ─── */
.corner{position:fixed;top:14px;right:16px;z-index:300;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.corner.hidden{display:none}
.chip-row{display:flex;gap:9px}
.chip-wrap{position:relative}
.chip{
  display:flex;align-items:center;gap:9px;max-width:230px;
  padding:8px 14px;border:1px solid rgba(255,255,255,.8);border-radius:999px;
  background:var(--glass-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 10px 28px rgba(0,0,0,.14);cursor:pointer;font-family:inherit;
  color:var(--txt);font-size:.82rem;font-weight:700;
  transition:transform .18s,box-shadow .18s;
}
.chip:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.2)}
.chip:active{transform:scale(.96)}
.chip img,.chip .g-img,.chip .g-ico{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none}
.chip .g-ico{font-size:.68rem}
.chip .chip-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.chip .caret{font-size:.7em;color:var(--mut);transition:transform .2s}
.chip.open .caret{transform:rotate(180deg)}

.dd-right{left:auto;right:0;transform-origin:top right;transform:translateY(-8px) scale(.97)}
.dd-right.open{transform:translateY(0) scale(1)}
.dd-title{display:flex;align-items:center;justify-content:space-between}
.mini-btn{
  cursor:pointer;border:none;background:rgba(88,101,242,.12);color:var(--blur);
  width:26px;height:26px;border-radius:8px;font-size:.9rem;line-height:1;font-family:inherit;
  transition:all .2s;
}
.mini-btn:hover{transform:rotate(180deg);background:rgba(88,101,242,.2)}
.acct-row,.guild-row{cursor:pointer;transition:background .15s,transform .15s}
.guild-row{border-radius:16px;padding:10px 12px}
.acct-row:active,.guild-row:active{transform:scale(.98)}
.acct-row.active,.guild-row.active{background:rgba(88,101,242,.13);box-shadow:inset 0 0 0 1px rgba(88,101,242,.3)}
.g-ico{width:38px;height:38px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:var(--mut);flex:none}
.g-img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none}

/* ├── micro-animations ── */
.link-btn:active{transform:scale(.96)}
.unlink-btn:active{transform:scale(.9)}

label{display:block;text-align:left;font-size:.76rem;color:var(--mut);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input{
  width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.75);color:var(--txt);font-size:.9rem;margin-bottom:14px;
  outline:none;transition:border .2s;font-family:inherit;
}
input:focus{border-color:var(--blur)}
input::placeholder{color:#9aa0ab}
button{font-family:inherit}

@media (max-width:560px){
  .f-item{flex-direction:column;gap:2px}
  .f-name{min-width:0}
  .dd{width:310px}
  .chip{max-width:165px}
}

/* ─── Cấu hình server (sidebar 5 thẻ) ─── */
.gcfg{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,12,20,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gcfg-box{display:flex;width:min(1040px,96vw);height:min(770px,92vh);background:var(--glass-strong);border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.gcfg-side{width:224px;flex:none;padding:14px 10px;border-right:1px solid var(--line);background:rgba(255,255,255,.35);display:flex;flex-direction:column;gap:5px}
.gcfg-guild{display:flex;align-items:center;gap:8px;padding:8px 8px 12px;margin-bottom:4px;font-weight:800;font-size:.88rem;border-bottom:1px solid var(--line);word-break:break-word}
.gcfg-guild .g-img,.gcfg-guild .g-ico{width:30px;height:30px}
.gcfg-item{cursor:pointer;text-align:left;border:none;background:transparent;font-family:inherit;font-size:.88rem;font-weight:600;color:var(--txt);padding:11px 12px;border-radius:12px;transition:background .15s}
.gcfg-item:hover{background:rgba(30,31,36,.06)}
.gcfg-item.active{background:rgba(88,101,242,.14);box-shadow:inset 0 0 0 1px rgba(88,101,242,.3)}
.gcfg-main{flex:1;min-width:0;display:flex;flex-direction:column}
.gcfg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);gap:10px}
.gcfg-head h3{font-size:1.02rem}
.gcfg-head .right{display:flex;align-items:center;gap:10px}
.gcfg-hint{font-size:.72rem;color:var(--mut)}
.gcfg-hint.err{color:#e5484d}
.gcfg-hint.ok{color:#2fb472}
.gcfg-body{padding:18px 20px 26px;overflow-y:auto}
.gcfg-loading{padding:50px;text-align:center;color:var(--mut)}
.gcfg label{display:block;text-align:left;font-size:.72rem;color:var(--mut);margin:14px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.gcfg input[type=text],.gcfg input[type=number],.gcfg textarea,.gcfg select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.8);color:var(--txt);font-size:.86rem;font-family:inherit;outline:none;transition:border .2s}
.gcfg input:focus,.gcfg textarea:focus,.gcfg select:focus{border-color:var(--blur)}
.gcfg textarea{min-height:72px;resize:vertical;line-height:1.45}
.gcfg select[multiple]{padding:6px}
.gcfg input[type=color]{width:56px;height:36px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff;vertical-align:middle}
.gcfg .sm{font-size:.72rem;color:var(--mut);text-transform:none;letter-spacing:0;font-weight:500;margin-top:6px;line-height:1.5}
.gcfg-chk{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600;text-transform:none;letter-spacing:0}
.gcfg-chk input{width:auto}
.gcfg-chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0;min-height:8px}
.gcfg-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(88,101,242,.12);border:1px solid rgba(88,101,242,.25);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600}
.gcfg-chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.gcfg-chip button{border:none;background:transparent;cursor:pointer;color:var(--mut);font-size:.82rem;padding:0 2px}
.gcfg-actions{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.gcfg-actions .link-btn{width:auto;padding:11px 24px;margin:0;display:inline-flex}
.gcfg-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcfg-emoji-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;max-height:150px;overflow-y:auto;padding:6px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.6)}
.gcfg-emoji{width:34px;height:34px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer;font-size:1.1rem;line-height:1;display:flex;align-items:center;justify-content:center}
.gcfg-emoji:hover{background:rgba(30,31,36,.06)}
.gcfg-emoji.sel{border-color:var(--blur);background:rgba(88,101,242,.16)}
.gcfg-emoji img{width:24px;height:24px}
.gcfg-itemrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.6)}
.gcfg-itemrow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.gcfg-itemrow .emo{font-size:1.15rem;line-height:1;flex:none}
.gcfg-itemrow .grow{flex:1;min-width:0}
.gcfg-itemrow .ename{font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcfg-itemrow .rm{cursor:pointer;border:none;background:rgba(229,72,77,.12);color:#e5484d;border-radius:9px;padding:6px 10px}
.gcfg-search{margin-bottom:6px}
.gcfg-picklist{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.6)}
.gcfg-picklist .pk{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;font-size:.84rem}
.gcfg-picklist .pk:hover{background:rgba(88,101,242,.1)}
.gcfg-picklist .pk .dot{width:10px;height:10px;border-radius:50%;flex:none}
.gcfg-picklist .pk .badge{font-size:.64rem;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:auto;white-space:nowrap}
.gcfg-picklist .pk.on{background:rgba(47,180,114,.12)}
@media(max-width:720px){
  .gcfg{padding:10px}
  .gcfg-box{flex-direction:column;height:94vh}
  .gcfg-side{width:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px}
  .gcfg-guild{display:none}
  .gcfg-item{white-space:nowrap;padding:9px 12px}
  .gcfg-2col{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ─── Góc phải: chips Tài khoản/Nhóm ─── -->
<div class="corner hidden" id="corner">
  <div class="chip-row">
    <div class="chip-wrap">
      <button class="chip" id="acctChip" onclick="toggleDropdown('account')"><span class="chip-name">Chưa liên kết</span><span class="caret">▾</span></button>
      <div class="dd dd-right" id="ddAccount">
        <div class="dd-title"><span>Tài khoản</span></div>
        <div id="acctList2"></div>
        <div class="dd-empty" id="ddEmpty2">Chưa có tài khoản nào được liên kết.</div>
        <button class="link-btn" onclick="startOAuth()">+ Liên kết thêm Discord</button>
      </div>
    </div>
    <div class="chip-wrap">
      <button class="chip" id="guildChip" onclick="toggleDropdown('guild')"><span class="chip-name">Chọn server</span><span class="caret">▾</span></button>
      <div class="dd dd-right" id="ddGuild">
        <a class="link-btn" href="https://discord.com/api/oauth2/authorize?client_id=1507978908224454747&permissions=8&scope=bot%20applications.commands" target="_blank" rel="noopener noreferrer">➕ Thêm bot vào server</a>
        <div class="dd-title"><span>Chọn server đang có</span><span style="display:flex;gap:6px"><button class="mini-btn" onclick="refreshGuilds()" title="Làm mới">↻</button></span></div>
        <div id="guildList"></div>
        <div class="dd-empty" id="guildEmpty">Không có server nào bạn quản trị.</div>
      </div>
    </div>
  </div>
</div>

<!-- ─── Landing (giao diện duy nhất) ─── -->
<main class="hero view active" id="viewMember">
  <div class="login-wrap">
    <button class="login-btn" id="loginBtn" onclick="toggleDd()">
      Đăng nhập <span class="caret">▾</span>
    </button>

    <div class="dd" id="dd">
      <div class="dd-title">Tài khoản đã liên kết</div>
      <div id="acctList"></div>
      <div class="dd-empty" id="ddEmpty">Chưa có tài khoản nào được liên kết.</div>
      <button class="link-btn" id="linkBtn" onclick="startOAuth()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Liên kết với Discord
      </button>
      <p class="login-err" id="loginErr"></p>
    </div>
  </div>

  <div class="hero-foot">© 2026 Clowo — Auto-mod · Game · Ticket · Welcome</div>
</main>

<!-- ─── Cấu hình server (sidebar 5 thẻ) ─── -->
<div class="gcfg" id="viewSettings">
  <div class="gcfg-box">
    <aside class="gcfg-side">
      <div class="gcfg-guild" id="gcfgGuildInfo"></div>
      <button class="gcfg-item active" data-card="welcome" onclick="gcfgShow('welcome')">🎉 Welcome</button>
      <button class="gcfg-item" data-card="ticket" onclick="gcfgShow('ticket')">🎫 Ticket</button>
      <button class="gcfg-item" data-card="voice" onclick="gcfgShow('voice')">🔊 Tạo voice</button>
      <button class="gcfg-item" data-card="emojiRole" onclick="gcfgShow('emojiRole')">😀 Emoji role</button>
      <button class="gcfg-item" data-card="pickrole" onclick="gcfgShow('pickrole')">🎭 Pickrole</button>
    </aside>

async function unlinkAccount(id) {

        body: JSON.stringify({ session: rem.session })

  saveAccounts(getAccounts().filter(a => a.id !== id));
  if (activeId() === id) {
    storeDel(LS_ACT);
    lsDel(LS_ACT);
    const first = getAccounts()[0];
    if (first) setActiveAccount(first.id);
  }
  renderAccounts();
}

let _pending = {};
let _acting = {};
let _wants = {};
const LOCK_GRACE = 70000;
async function loadLocks() {
  const acc = activeAccount();
  if (!acc || !acc.session) { syncLockUI(); return; }
  try {
    const r = await fetch(WORKER + '/locks', { headers: { 'Authorization': 'Bearer ' + acc.session } });
    if (!r.ok) return;
    const d = await r.json();
    const ld = (d && d.locks) || {};
    const now = Date.now();
    for (const gid in _locks) {
      if (ld[gid] || !_locks[gid]) continue;
      if (now - _locks[gid].at < LOCK_GRACE) ld[gid] = _locks[gid];
    }
    _locks = ld;
  } catch {}
  const now = Date.now();
  for (const gid in _pending) {
    const p = _pending[gid];
    if (now - p.t > LOCK_GRACE) { delete _pending[gid]; continue; }
    if (p.uid) _locks[gid] = { uid: p.uid, at: p.t };
    else delete _locks[gid];
  }
  syncLockUI();
}

function lockOf(gid) { return _locks[gid] || null; }

function selectGuild(gid) {
  const a = activeAccount();
  if (!a) { flashGuild('Chưa chọn tài khoản — bấm vào account ở trên để chọn.'); dl('bấm dòng ' + gid + ' → chưa có tài khoản active'); return; }
  const L = lockOf(gid);
  if (L && L.uid !== a.id) { flashGuild('Server này đang được người khác quản lý — không chọn được.'); dl('bấm dòng ' + gid + ' → người khác quản lý (toast)'); return; }
  _selGuild = gid;
  dl('bấm dòng ' + gid + ' → đã chọn (không đổi trạng thái khóa)');
  syncLockUI();
}

async function postLock(path, payload) {
  for (let i = 0; i < 3; i++) {
    try {
      const r = await cw(path, { method: 'POST', body: JSON.stringify(payload) });
      if (r.status !== 429) return r;
    } catch (e) {
      return { status: 0, error: 'Không kết nối được Worker: ' + e.message };
    }
    await new Promise(res => setTimeout(res, 1200));
  }
  return { status: 429, error: 'Bạn thao tác hơi nhanh — chờ vài giây rồi thử lại.' };
}

function handleLockFail(d, what) {
  dl('FAIL ' + (d.status || '') + ' ' + (d.error || d.message || '') + ' (' + what + ')');
  flashGuild(d.error || ('Không ' + what + '.'));
}

async function lockGuildNow(gid) { wantLockAction(gid, 'lock'); }
async function unlockGuildNow(gid) { wantLockAction(gid, 'unlock'); }

let _tapAt = {};
function tapToggle(gid, kind) {
  const p = _tapAt[gid];
  if (p && p.kind === kind && Date.now() - p.at < 400) return;
  _tapAt[gid] = { kind, at: Date.now() };
  (kind === 'lock' ? lockGuildNow : unlockGuildNow)(gid);
}

function wantLockAction(gid, kind) {
  const a = activeAccount();
  const L = lockOf(gid);
  if (kind === 'lock') {
    if (L && L.uid !== a.id) {
      flashGuild('Server này đang được người khác quản lý — không chọn được.');
      dl('bấm ' + gid + ' → người khác quản lý (từ chối khóa)');
      return;
    }
    if (!L && a) _locks[gid] = { uid: a.id, at: Date.now() };
} else {
      delete _locks[gid];
    }
  if (a) _pending[gid] = { uid: kind === 'lock' ? a.id : null, t: Date.now() };
  syncLockUI();
  if (!_acting[gid]) { runLockAction(gid, kind); return; }
  if (kind === _acting[gid]) {
    if (_wants[gid]) delete _wants[gid];
    return;
  }
  _wants[gid] = kind;
}

let _autoRetried = {};
function pickBestAltAccount(preferUid) {
  const curId = activeId();
  const cands = getAccounts().filter(x => x.session && x.id !== curId);
  return cands.find(x => x.id === preferUid)
    || cands[0] || null;
}

function finishLockAction(gid) {
  delete _acting[gid];
  const w = _wants[gid];
  if (w) { delete _wants[gid]; runLockAction(gid, w); }
}

async function runLockAction(gid, kind) {
  const a = activeAccount();
  if (!a) {
    finishLockAction(gid);
    return;
  }
  _acting[gid] = kind;
  let wasLockBy = null;
  const path = kind === 'lock' ? '/lock' : '/unlock';
  try {
    if (kind === 'lock') {
      const L = lockOf(gid);
      if (L && L.uid !== a.id) { flashGuild('Server này đang được người khác quản lý.'); return; }
      if (!L) _locks[gid] = { uid: a.id, at: Date.now() };
    } else {
      wasLockBy = lockOf(gid) ? lockOf(gid).uid : null;
      delete _locks[gid];
    }
    syncLockUI();
    const d = await postLock(path, { guildId: gid, session: a.session });
    if (d.status === 200 && d.ok) {
      if (!(_wants[gid] && _wants[gid] !== kind)) {
        _pending[gid] = { uid: kind === 'lock' ? a.id : null, t: Date.now() };
      }
      dl((kind === 'lock' ? 'POST /lock' : 'POST /unlock') + ' → OK (' + gid + ')');
      setTimeout(loadLocks, 1500);
    } else if (d.status === 401 && !_autoRetried[gid + ':' + kind]) {
      _autoRetried[gid + ':' + kind] = Date.now();
      const alt = pickBestAltAccount(kind === 'unlock' ? wasLockBy : null);
      if (alt) {
        setActiveAccount(alt.id);
        renderAccounts();
        dl('Token "' + a.name + '" hết hạn (401) → chuyển sang "' + alt.name + '" và thử lại 1 lần.');
        flashGuild('Token "' + a.name + '" hết hạn — đã chuyển sang "' + alt.name + '" và thử lại.');
        const d2 = await postLock(path, { guildId: gid, session: alt.session });
        if (d2.status === 200 && d2.ok) {
          if (!(_wants[gid] && _wants[gid] !== kind)) {
            _pending[gid] = { uid: kind === 'lock' ? alt.id : null, t: Date.now() };
          }
          dl('(thử lại ' + alt.name + ') ' + (kind === 'lock' ? 'POST /lock' : 'POST /unlock') + ' → OK (' + gid + ')');
          setTimeout(loadLocks, 1500);
        } else {
          delete _pending[gid];
          if (kind === 'lock') delete _locks[gid];
          handleLockFail(d2, kind === 'lock' ? 'khóa được server' : 'mở khóa được');
          loadLocks();
        }
      } else {
        delete _pending[gid];
        if (kind === 'lock') delete _locks[gid];
        handleLockFail(d, kind === 'lock' ? 'khóa được server' : 'mở khóa được');
        loadLocks();
      }
    } else {
      delete _pending[gid];
      if (kind === 'lock') delete _locks[gid];
      handleLockFail(d, kind === 'lock' ? 'khóa được server' : 'mở khóa được');
      loadLocks();
    }
  } finally {
    finishLockAction(gid);
  }
}

function appendRow(list, g, mine, other) {
  const a = activeAccount();
  const L = lockOf(g.id);
  const m = (mine != null) ? mine : (!!L && L.uid === a.id);
  const o = (other != null) ? other : (!!L && L.uid !== a.id);
  const row = document.createElement('div');
  row.className = 'guild-row' + (g.id === _selGuild ? ' active' : '') + (o ? ' disabled' : '');
  row.setAttribute('data-g', g.id);
  const sub = o ? 'Đang quản lý bởi người khác' : (m ? 'Bạn đang quản lý' : 'Chưa khóa');

    ? () => { flashGuild('Server đang được người khác quản lý — không chọn được.'); dl('bấm dòng ' + g.id + ' → người khác quản lý (toast)'); }
    : () => openGuildFlow(g.id);

function myLockExtras(a, gu) {
  const out = [];
  for (const gid in _locks) {
    const L = _locks[gid];
    if (!L || L.uid !== a.id) continue;
    if (gu.some(g => g.id === gid)) continue;
    const f = (a.guilds || []).find(g => g.id === gid);
    out.push(f ? { id: f.id, name: f.name, icon: f.icon } : { id: gid, name: 'Server ' + gid, icon: null });
  }
  return out;
}

function syncLockUI() {
  const list = document.getElementById('guildList');
  const empty = document.getElementById('guildEmpty');
  const chip = document.getElementById('guildChip');
  const a = activeAccount();
  if (!a || !list.firstChild) return;
  const gu = manageableGuilds(a);
  const extras = myLockExtras(a, gu);
  if (_selGuild && !gu.some(g => g.id === _selGuild) &&
      !(lockOf(_selGuild) && lockOf(_selGuild).uid === a.id)) _selGuild = null;
  const sel = gu.find(g => g.id === _selGuild);
  chip.innerHTML = sel
    ? `${gIco(sel)}<span class="chip-name">${escapeHtml(sel.name)}</span><span class="caret">▾</span>`
    : '<span class="chip-name">Chọn server</span><span class="caret">▾</span>';
  const nothing = !gu.length && !extras.length;
  empty.style.display = nothing ? 'block' : 'none';
  if (nothing) {
    empty.textContent = (a.guilds || []).length ? 'Không có server nào bạn quản trị.' : 'Bấm ↻ để tải danh sách server.';
  }
  gu.forEach(g => {
    const row = list.querySelector('.guild-row[data-g="' + g.id + '"]');
    if (!row) return;
    const L = lockOf(g.id);
    const mine = !!L && L.uid === a.id;
    const other = !!L && L.uid !== a.id;
    row.className = 'guild-row' + (g.id === _selGuild ? ' active' : '') + (other ? ' disabled' : '');
    const sub = row.querySelector('.acct-sub');
    if (sub) sub.textContent = other ? 'Đang quản lý bởi người khác' : (mine ? 'Bạn đang quản lý' : 'Chưa khóa');
    const lb = row.querySelector('.lock-toggle');
    if (!lb) { row.insertAdjacentHTML('beforeend', lockBtnHtml(g, mine, other)); return; }
    if ((lb.tagName === 'BUTTON') === (!other)) {
      lb.className = 'lock-toggle' + ((mine || other) ? ' on' : '') + (other ? ' off' : '');
      lb.title = other ? 'Server này đang được người khác quản lý' : (mine ? 'Mở khóa server' : 'Khóa server');
      if (other) lb.removeAttribute('onclick');
      else lb.setAttribute('onclick', "event.stopPropagation();tapToggle('" + g.id + "','" + (mine ? 'unlock' : 'lock') + "')");
    } else {
      lb.outerHTML = lockBtnHtml(g, mine, other);
    }
  });
  const extraIds = extras.map(g => g.id);
  Array.from(list.children).forEach(row => {
    const gid = row.getAttribute ? row.getAttribute('data-g') : '';
    if (gid && !gu.some(g => g.id === gid) && !extraIds.includes(gid)) row.remove();
  });
  extras.forEach(g => {
    if (!list.querySelector('.guild-row[data-g="' + g.id + '"]')) appendRow(list, g, true, false);
  });
}

let _guildsSig = '';

function lazyRefresh() {
  const a = activeAccount();
  if (!a || _refreshing) return;
  if (a.session && !(a.guilds || []).length) refreshGuilds();
}

async function refreshGuilds() {
  const a = activeAccount();
  const empty = document.getElementById('guildEmpty');
  if (!a) return;
  if (!a.session) {
    empty.style.display = 'block';
    empty.textContent = 'Phiên đăng nhập hết hạn — đăng nhập lại tài khoản để tải server.';
    return;
  }
  if (_refreshing) return;
  _refreshing = true;
  empty.style.display = 'block';
  empty.textContent = 'Đang tải danh sách server...';
  try {
    const r = await fetch(WORKER + '/guilds', {
      headers: { 'Authorization': 'Bearer ' + a.session }
    });
    if (r.status === 401 || r.status === 403) {
      empty.textContent = 'Phiên đăng nhập hết hạn — đăng nhập lại tài khoản này.';
      return;
    }
    if (!r.ok) { empty.textContent = 'Lỗi khi tải server.'; return; }
    const guilds = await r.json();
    const accs = getAccounts();
    const ac = accs.find(x => x.id === a.id);
    if (ac) ac.guilds = (guilds || []).map(g => ({ id: g.id, name: g.name, icon: g.icon, permissions: g.permissions }));
    saveAccounts(accs);
    renderCorner();
  } catch {
    empty.textContent = 'Không tải được server.';
  } finally { _refreshing = false; }
}

function startOAuth() {
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem(LS_OAUTH, state); } catch (e) {}
  const url =
    `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}` +
    `&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT)}` +
    `&scope=identify%20guilds&state=${state}&nonce=${Math.random().toString(36).slice(2)}`;
  window.location.href = url;
}

// Đăng nhập lại tài khoản Discord (dùng khi phiên hết hạn) — Worker tạo phiên mới, trình duyệt chỉ giữ session id
function upsertLinkedAccount(obj) {
  const accs = getAccounts();
  const ex = accs.find(a => a.id === obj.id);
  if (ex) {
    Object.assign(ex, obj);
  } else {
    accs.unshift(obj);
  }
  saveAccounts(accs);
  return ex || accs[0];
}

function handleAuth() {
  const h = location.hash;
  if (!h || !h.includes('access_token')) return;
  const p = new URLSearchParams(h.slice(1));
  const err = document.getElementById('loginErr');
  const token = p.get('access_token');
  location.hash = '';
  let wantState = null;
  try { wantState = sessionStorage.getItem(LS_OAUTH); sessionStorage.removeItem(LS_OAUTH); } catch (e) {}
  if (!token) {
    err.style.display = 'block';
    err.textContent = p.get('error_description') || 'Không thể đăng nhập Discord.';
    return;
  }
  if (wantState && p.get('state') !== wantState) {
    err.style.display = 'block';
    err.textContent = 'Phiên đăng nhập không hợp lệ (state) — bấm lại nút liên kết.';
    dl('OAuth state KHÔNG khớp → từ chối token');
    return;
  }
  err.style.display = 'none';
  // Trao token cho Worker 1 lần → nhận phiên (session id); token KHÔNG được lưu trong trình duyệt
  fetch(WORKER + '/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token })
  })
    .then(r => r.json().then(j => ({ st: r.status, j: j })))
    .then(function (res) {
      var d = res.j;
      if (!d || !d.session) {
        err.style.display = 'block';
        err.textContent = (d && d.error) || 'Phiên đăng nhập không hợp lệ, thử lại nhé.';
        return;
      }
      const ex = getAccounts().find(a => a.id === d.uid);
      const obj = {
        id: d.uid,
        name: d.name,
        avatar: d.avatar,
        session: d.session,
        joined: ex ? ex.joined : Date.now(),
        guilds: (d.guilds || []).map(g => ({ id: g.id, name: g.name, icon: g.icon, permissions: g.permissions }))
      };
      upsertLinkedAccount(obj);
      setActiveAccount(d.uid);
      renderAccounts();
      loadLocks();
    })
    .catch(function () { renderAccounts(); });
}

// ─── Control panel (qua Cloudflare Worker — không cần PAT) ───
async function cw(path, opts) {
  const o = opts || {};
  const ln = o.method || 'GET';
  const headers = { 'Content-Type': 'application/json', ...((o && o.headers) || {}) };
  try {
    const r = await fetch(WORKER + path, { ...o, headers });
    let d = {};
    try { d = await r.json(); } catch {}
    dl(ln + ' ' + path + ' → ' + r.status + (d.error ? ' ' + d.error : ''));
    return { status: r.status, ...d };
  } catch (e) {
    dl(ln + ' ' + path + ' → X ' + e.message);
    return { status: 0, error: 'Không kết nối được Worker: ' + e.message };
  }
}

function mergeCfg(c) {

  }
  if (c && c.rev != null) base.rev = c.rev;
  return base;
}

function htmlTicket() {
  const t = _cfg.ticket; const d = gcfgDis();
  const chips = t.allow.map(a => `<span class="gcfg-chip"><span class="dot" style="background:${a.type === 'role' ? hexColor((cfgRole(a.id) || {}).color) : '#5865f2'}"></span>@${cfgEsc(a.type === 'role' ? cfgRoleName(a.id) : cfgMemberName(a.id))}<button onclick="tAllowDel('${a.id}')"${d}>✕</button></span>`).join('') || '<span class="sm">Chưa thêm ai.</span>';
  return `
  <div class="gcfg-row"><label class="gcfg-chk"><input type="checkbox" id="t_enabled"${t.enabled ? ' checked' : ''}${d}> Bật hệ thống ticket</label></div>
  <label>ID category chứa ticket (bắt buộc)</label>
  <input type="text" id="t_cat" value="${cfgEsc(t.categoryId)}" placeholder="VD 123456789012345678"${d}>
  <label>Nội dung panel (/setup loại:ticket)</label>
  <textarea id="t_panel_content" placeholder="Bấm nút bên dưới để tạo ticket hỗ trợ."${d}>${cfgEsc(t.panel.content)}</textarea>
  <label>Màu panel</label>
  <input type="color" id="t_panel_color" value="${hexColor(t.panel.color)}"${d}>
  <label>Nội dung kênh ticket mới</label>
  <textarea id="t_ticket_content" placeholder="Chào {mention}, hãy mô tả vấn đề của bạn."${d}>${cfgEsc(t.ticket.content)}</textarea>
  <label>Màu ticket</label>
  <input type="color" id="t_ticket_color" value="${hexColor(t.ticket.color)}"${d}>
  <label>Người/role được nhắc tên và xem ticket</label>
  <div class="gcfg-chips">${chips}</div>
  <input class="gcfg-search" type="text" id="t_search" placeholder="Tìm người hoặc role..." oninput="renderTicketPicklist()"${d}>
  <div class="gcfg-picklist" id="t_picklist"></div>
  <div class="gcfg-actions"><button class="link-btn" onclick="saveTicket()"${d}>Lưu Ticket</button></div>`;
}
function renderTicketPicklist() {
  const box = document.getElementById('t_picklist'); if (!box) return;
  const q = (document.getElementById('t_search').value || '').toLowerCase().trim();
  const roles = _cfgMeta.roles.slice().sort((a, b) => (b.position || 0) - (a.position || 0));
  let rows = roles.map(r => ({ id: r.id, type: 'role', name: r.name, color: r.color }));
  rows = rows.concat((_cfgMeta.members || []).map(m => ({ id: m.id, type: 'user', name: m.name })));
  let list = rows.filter(x => !q || x.name.toLowerCase().includes(q) || x.id.includes(q));
  const roleRows = list.filter(x => x.type === 'role');
  const memRows = list.filter(x => x.type === 'user').slice(0, 60);
  const allowed = new Set(_cfg.ticket.allow.map(a => a.id));
  box.innerHTML = (roleRows.concat(memRows)).map(x => {
    const on = allowed.has(x.id);
    const color = x.type === 'role' ? hexColor(x.color) : '#5865f2';
    return `<div class="pk${on ? ' on' : ''}" onclick="tAllowToggle('${x.id}','${x.type}')"><span class="dot" style="background:${color}"></span><span>@${cfgEsc(x.name)}</span><span class="badge">${on ? '✓ đã thêm' : (x.type === 'role' ? 'role' : 'user')}</span></div>`;
  }).join('') || '<div class="pk" style="color:#999">Không tìm thấy.</div>';
}
function tAllowToggle(id, type) {
  if (!_cfgEditable) return;
  const a = _cfg.ticket.allow; const i = a.findIndex(x => x.id === id);
  if (i >= 0) a.splice(i, 1); else a.push({ id: id, type: type });
  gcfgRender();
}
function tAllowDel(id) {
  if (!_cfgEditable) return;
  _cfg.ticket.allow = _cfg.ticket.allow.filter(x => x.id !== id);
  gcfgRender();
}
async function saveTicket() {
  if (!_cfgEditable) return;
  const t = _cfg.ticket;
  t.enabled = document.getElementById('t_enabled').checked;
  t.categoryId = document.getElementById('t_cat').value.trim();
  t.panel = { content: document.getElementById('t_panel_content').value, color: colorToInt(document.getElementById('t_panel_color').value) };
  t.ticket = { content: document.getElementById('t_ticket_content').value, color: colorToInt(document.getElementById('t_ticket_color').value) };
  if (t.enabled && !/^\d{15,20}$/.test(t.categoryId)) { showToast('Cần nhập ID category hợp lệ để bật ticket.', false); return; }
  await saveCfg('Đã lưu Ticket.');
}

/* ── Voice ── */
function htmlVoice() {
  const v = _cfg.voice; const d = gcfgDis();
  return `
  <div class="gcfg-row"><label class="gcfg-chk"><input type="checkbox" id="v_enabled"${v.enabled ? ' checked' : ''}${d}> Bật tạo voice tự động</label></div>
  <label>ID kênh voice hub</label>
  <input type="text" id="v_hub" value="${cfgEsc(v.hubChannelId)}" placeholder="Thành viên bấm vào kênh này để tạo phòng riêng"${d}>
  <label>ID category chứa phòng voice mới</label>
  <input type="text" id="v_cat" value="${cfgEsc(v.categoryId)}" placeholder="VD 123456789012345678"${d}>
  <div class="sm">Khi thành viên vào kênh hub, bot tạo một kênh voice riêng và chuyển họ vào. Kênh tự xóa sau 30 giây khi trống.</div>
  <div class="gcfg-actions"><button class="link-btn" onclick="saveVoice()"${d}>Lưu Voice</button></div>`;
}
async function saveVoice() {
  if (!_cfgEditable) return;
  const v = _cfg.voice;
  v.enabled = document.getElementById('v_enabled').checked;
  v.hubChannelId = document.getElementById('v_hub').value.trim();
  v.categoryId = document.getElementById('v_cat').value.trim();
  if (v.enabled && (!/^\d{15,20}$/.test(v.hubChannelId) || !/^\d{15,20}$/.test(v.categoryId))) { showToast('Cần nhập ID kênh hub và ID category hợp lệ để bật.', false); return; }
  await saveCfg('Đã lưu Voice.');
}

/* ── Emoji role ── */
function hasStartEmoji(name) { return /^\p{Extended_Pictographic}/u.test((name || '').trim()); }
function htmlEmojiRole() {
  const e = _cfg.emojiRole; const d = gcfgDis();
  const roleOpts = _cfgMeta.roles.slice().sort((a, b) => (b.position || 0) - (a.position || 0))
    .map(r => {
      const em = hasStartEmoji(r.name);
      return `<option value="${r.id}"${e.roles.includes(r.id) ? ' selected' : ''}>${em ? '✓' : '✗'} ${cfgEsc(r.name)}${em ? '' : ' (không có emoji đầu tên)'}</option>`;
    }).join('');
  return `
  <div class="sm">Cách hoạt động: role có emoji ở <b>đầu</b> tên (ví dụ <b>🔥 VIP</b>) → bot tự thêm emoji đó vào trước biệt danh của thành viên có role. Bỏ role → bot gỡ emoji. Chỉ áp dụng cho các role bạn thêm bên dưới.</div>
  <div class="gcfg-row"><label class="gcfg-chk"><input type="checkbox" id="er_enabled"${e.enabled ? ' checked' : ''}${d}> Bật emoji role</label></div>
  <label>Chọn role có emoji ở đầu tên (giữ Ctrl/Cmd để chọn nhiều)</label>
  <select id="er_roles" multiple size="8"${d}>${roleOpts}</select>
  <div class="sm">✓ = role bắt đầu bằng emoji (hoạt động được). ✗ = role không có emoji đầu tên — đổi tên role thành dạng "🔥 VIP" thì mới có hiệu lực.</div>
  <div class="gcfg-actions"><button class="link-btn" onclick="saveEmojiRole()"${d}>Lưu Emoji role</button></div>`;
}
async function saveEmojiRole() {
  if (!_cfgEditable) return;
  const e = _cfg.emojiRole;
  e.enabled = document.getElementById('er_enabled').checked;
  e.roles = Array.from(document.getElementById('er_roles').selectedOptions).map(o => o.value);
  await saveCfg('Đã lưu Emoji role.');
}

/* ── Pickrole ── */
function roleMark(r) {
  if (!r || r.managed === true) return ' 🔒';
  if (r.elevated) return ' ⚠ quyền quản trị';
  if (r.editable === false) return ' ⛔ chưa gán được';
  return '';
}
function roleMsg(r) {
  if (!r) return 'role không còn trong server.';
  if (r.managed === true) return 'role hệ thống/integration — Discord không cho gán.';
  if (r.editable === false) return 'kéo role bot lên trên nó và bật Manage Roles để gán được.';
  if (r.elevated) return 'role có quyền quản trị — ai thả emoji sẽ nhận quyền này.';
  return '';
}
function htmlPickrole() {
  const p = _cfg.pickrole; const d = gcfgDis();
  const warnItems = p.items.filter(it => { const rr = cfgRole(it.roleId); return !rr || rr.managed === true || rr.editable === false || rr.elevated; });
  const warnBad = warnItems.map(it => {
    const rr = cfgRole(it.roleId);
    return `<div class="sm" style="color:#f87171">⚠ @${cfgEsc(cfgRoleName(it.roleId))}: ${roleMsg(rr)}</div>`;
  }).join('');
  const rows = p.items.map(it => {
    const rr = cfgRole(it.roleId);
    return `<div class="gcfg-itemrow"><span class="emo">${cfgEsc(it.emoji)}</span><span class="grow"><span class="ename">@${cfgEsc(cfgRoleName(it.roleId))}${roleMark(rr)}</span></span><button class="rm" onclick="prItemDel('${it.roleId}')"${d}>✕</button></div>`;
  }).join('') || '<span class="sm">Chưa có lựa chọn — thêm bên dưới.</span>';
  const pickable = _cfgMeta.roles.filter(r => r.managed !== true);
  const roleOpts = pickable.slice().sort((a, b) => (b.position || 0) - (a.position || 0)).map(r => `<option value="${r.id}">${cfgEsc(r.name)}${roleMark(r) ? ' ' + roleMark(r) : ''}</option>`).join('');
  const noRoleMsg = pickable.length ? '(chưa có role nào gán được)' : '(server chưa có role thường để gán)';
  return `
  <div class="gcfg-row"><label class="gcfg-chk"><input type="checkbox" id="pr_enabled"${p.enabled ? ' checked' : ''}${d}> Bật pickrole</label></div>
  ${warnBad}
  <div class="sm">Role gán được nhờ <b>thả emoji</b> trên panel. Muốn gán role quyền quản trị: đưa role bot lên TRÊN role đó và bật <b>Manage Roles</b> cho bot. Role hệ thống (🔒) bị Discord khóa, không gán được.</div>
  <label>Nội dung panel (/pickrole)</label>
  <textarea id="pr_content" placeholder="Chọn role bằng cách thả emoji bên dưới."${d}>${cfgEsc(p.content)}</textarea>
  <label>Chế độ</label>
  <select id="pr_mode"${d}>
    <option value="multi"${p.mode === 'multi' ? ' selected' : ''}>Nhiều role (chọn nhiều)</option>
    <option value="single"${p.mode === 'single' ? ' selected' : ''}>Mỗi người 1 role (chọn mới bỏ cũ)</option>
  </select>
  <label>Danh sách lựa chọn</label>
  <div class="gcfg-chips" id="pr_items">${rows}</div>
  <label>Thêm lựa chọn: chọn role + chọn 1 emoji</label>
  <select id="pr_roleSel"${d}>${roleOpts || `<option value="">${noRoleMsg}</option>`}</select>
  <div class="sm">Emoji của server:</div>
  <div class="gcfg-emoji-grid" id="pr_emojiGrid"></div>
  <div class="sm">Emoji Discord / unicode:</div>
  <div class="gcfg-emoji-grid" id="pr_emojiUni"></div>
  <div class="gcfg-actions"><button class="link-btn" onclick="prAddItem()"${d}>＋ Thêm lựa chọn</button><button class="link-btn" onclick="savePickrole()"${d}>Lưu Pickrole</button></div>`;
}
function renderPrEmojiGrid() {
  const g = document.getElementById('pr_emojiGrid'); const u = document.getElementById('pr_emojiUni'); if (!g || !u) return;
  g.innerHTML = ''; u.innerHTML = '';
  (_cfgMeta.emojis || []).forEach(e => {
    const m = emu(e);
    const btn = document.createElement('button');
    btn.className = 'gcfg-emoji' + (_prEmojiSel === m ? ' sel' : '');
    btn.title = ':' + e.name + ':';
    btn.onclick = () => { _prEmojiSel = m; renderPrEmojiGrid(); };
    const img = document.createElement('img');
    img.src = 'https://cdn.discordapp.com/emojis/' + e.id + '.' + (e.animated ? 'gif' : 'png') + '?size=48';
    btn.appendChild(img); g.appendChild(btn);
  });
  if (!(_cfgMeta.emojis || []).length) g.innerHTML = '<span class="sm" style="padding:8px">Server chưa có emoji.</span>';
  PR_UNICODE.forEach(x => {
    const btn = document.createElement('button');
    btn.className = 'gcfg-emoji' + (_prEmojiSel === x ? ' sel' : '');
    btn.textContent = x;
    btn.onclick = () => { _prEmojiSel = x; renderPrEmojiGrid(); };
    u.appendChild(btn);
  });
}
function prAddItem() {
  if (!_cfgEditable) return;
  const r = document.getElementById('pr_roleSel').value;
  if (!r) { showToast('Chọn 1 role.', false); return; }
  const rr = cfgRole(r);
  if (!rr || rr.managed === true) { showToast('Role hệ thống/integration không gán được — chọn role khác.', false); return; }
  if (!_prEmojiSel) { showToast('Chọn 1 emoji.', false); return; }
  if (_cfg.pickrole.items.some(x => x.roleId === r)) { showToast('Role này đã có trong danh sách.', false); return; }
  _cfg.pickrole.items.push({ roleId: r, emoji: _prEmojiSel });
  _prEmojiSel = '';
  gcfgRender();
}
function prItemDel(id) {
  if (!_cfgEditable) return;
  _cfg.pickrole.items = _cfg.pickrole.items.filter(x => x.roleId !== id);
  gcfgRender();
}
async function savePickrole() {
  if (!_cfgEditable) return;
  const p = _cfg.pickrole;
  p.enabled = document.getElementById('pr_enabled').checked;
  p.content = document.getElementById('pr_content').value;
  p.mode = document.getElementById('pr_mode').value;
  if (p.enabled && !p.items.length) { showToast('Cần ít nhất 1 lựa chọn để bật pickrole.', false); return; }
  const high = p.items.some(it => { const rr = cfgRole(it.roleId); return rr && (rr.admin || rr.elevated); });
  if (high && !confirm('Có lựa chọn là role quyền quản trị/quản lí — bất kỳ ai thả emoji đều nhận quyền này. Tiếp tục lưu?')) return;
  await saveCfg('Đã lưu Pickrole.');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('viewSettings').style.display === 'flex') gcfgClose(); });

setInterval(loadLocks, 12000);
</script>
