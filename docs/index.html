  <label>Nội dung panel (/pickrole)</label>
  <textarea id="pr_content" placeholder="Thả emoji bên dưới để nhận role, gỡ emoji để bỏ role."${d}>${cfgEsc(p.content)}</textarea>
  <label>Chế độ</label>
  ${dd('pr_mode', [{ v: 'multi', l: 'Nhiều role (thả nhiều emoji)' }, { v: 'single', l: 'Mỗi người 1 role (thả emoji mới bỏ role cũ)' }], { value: p.mode, disabled: d, search: false })}
  <label>Danh sách lựa chọn</label>
  <div class="gcfg-chips" id="pr_items">${rows}</div>
  <label>Thêm lựa chọn: chọn role + chọn 1 emoji</label>
  ${dd('pr_roleSel', roleItems, { value: '', disabled: d, search: true })}
  <div class="sm">Emoji của server (đã bỏ giới hạn 200 emoji):</div>
  <div class="gcfg-emoji-grid" id="pr_emojiGrid"></div>
  <div class="sm">Bộ emoji Unicode đầy đủ — gõ để tìm theo tên, bấm nhóm để lọc:</div>
  <input class="pr-uni-q" id="pr_emoQ" type="search" placeholder="Tìm emoji: mèo, tim, cờ, bánh, spaceship…" autocomplete="off" oninput="prUniSearch(this.value)"${d}>
  <div class="pr-uni-tabs" id="pr_emoTabs"></div>
  <div class="gcfg-emoji-grid pr-uni-grid" id="pr_emojiUni"></div>
  <div class="gcfg-actions"><button class="link-btn" onclick="prAddItem()"${d}>＋ Thêm lựa chọn</button></div>`;
}
// Emoji trong chip dòng lựa chọn: emoji custom của server → hiện <img> thật (CDN Discord),
// emoji Unicode → giữ nguyên chữ (hiện đúng emoji).
function emoChip(v) {
  const s = String(v == null ? '' : v);
  const m = /^<(a?):([^:>]+):(\d{15,20})>$/.exec(s);
  if (m) {
    const url = 'https://cdn.discordapp.com/emojis/' + m[3] + '.' + (m[1] ? 'gif' : 'png') + '?size=48';
    return `<img class="emo-img" src="${url}" alt="${cfgEsc(m[2])}" title=":${cfgEsc(m[2])}:">`;
  }
  return cfgEsc(s);
}

// ── Bộ emoji Unicode ĐẦY ĐỦ (docs/emoji-data.js, ~120KB / ~1.900 emoji) ──
// Tải ĐỘNG khi mở thẻ Pick Role để không làm nặng trang; nạp một lần duy nhất.
let _prUniLoad = null;
let _prUniOk = false;
let _prUniGroup = null;
let _prUniQ = '';
let _prUniShown = [];

function prUniScript() {
  if (_prUniLoad) return _prUniLoad;
  _prUniLoad = new Promise(function (res) {
    const s = document.createElement('script');
    s.src = 'emoji-data.js';
    s.async = true;
    s.onload = function () {
      _prUniOk = !!(window.EMOJI_ROWS && window.EMOJI_ROWS.length);
      if (!_prUniOk) _prUniLoad = null; // nạp sai cấu trúc → lần sau tải lại
      res(_prUniOk);
    };
    s.onerror = function () { _prUniLoad = null; res(false); };
    document.head.appendChild(s);
  });
  return _prUniLoad;
}
function prUniSearch(v) { _prUniQ = String(v == null ? '' : v); prUniPaint(); }
function prUniPick(i) {
  const r = _prUniShown[i];
  if (!r || !_cfgEditable) return;
  _prEmojiSel = r[0];
  renderPrEmojiGrid();
}
function prUniRows() {
  const rows = window.EMOJI_ROWS || [];
  const q = _prUniQ.trim().toLowerCase();
  // Gõ tìm → quét TOÀN BỘ bộ emoji (không giới hạn số kết quả).
  if (q) return rows.filter(r => String(r[1] || '').indexOf(q) >= 0);
  // Tab "Tất cả" (nhóm -1) → hiện hết mọi emoji trong 1 lưới cuộn.
  if (_prUniGroup === -1) return rows;
  return rows.filter(r => r[2] === _prUniGroup);
}
function prUniPaint() {
  const tabs = document.getElementById('pr_emoTabs');
  const grid = document.getElementById('pr_emojiUni');
  if (!tabs || !grid || !_prUniOk) return;
  const names = window.EMOJI_GROUP_NAMES || [];
  if (_prUniGroup === null) _prUniGroup = -1; // mặc định mở tab "Tất cả"
  const q = _prUniQ.trim();
  // Tab "Tất cả" đặt đầu tiên → xem/lọc được toàn bộ ~1.900 emoji trong 1 lưới.
  tabs.innerHTML = `<button type="button" class="pr-uni-tab${(!q && _prUniGroup === -1) ? ' on' : ''}" data-g="-1">Tất cả</button>` +
    names.map(function (n) {
      return `<button type="button" class="pr-uni-tab${(!q && n[0] === _prUniGroup) ? ' on' : ''}" data-g="${n[0]}">${cfgEsc(n[1])}</button>`;
    }).join('');
  Array.prototype.forEach.call(tabs.querySelectorAll('.pr-uni-tab'), function (b) {
    b.onclick = function () { _prUniGroup = Number(b.getAttribute('data-g')); prUniPaint(); };
  });
  const list = prUniRows();
  const top = grid.scrollTop;
  _prUniShown = list;
  if (!list.length) {
    grid.innerHTML = '<span class="pr-uni-note">Không tìm thấy emoji nào khớp — thử từ khoá khác nhé.</span>';
    grid.scrollTop = top;
    return;
  }
  grid.innerHTML = list.map(function (r, i) {
    const kw = String(r[1] || '').split(' ').slice(0, 3).join(' ');
    return `<button type="button" class="gcfg-emoji${_prEmojiSel === r[0] ? ' sel' : ''}" title="${cfgEsc(kw)}" onclick="prUniPick(${i})">${r[0]}</button>`;
  }).join('') + (q ? `<span class="pr-uni-note">${list.length} emoji khớp “${cfgEsc(q)}”.</span>` : '');
  grid.scrollTop = top;
}
function renderPrEmojiGrid() {
  const g = document.getElementById('pr_emojiGrid'); const u = document.getElementById('pr_emojiUni'); if (!g || !u) return;
  g.innerHTML = '';
  (_cfgMeta.emojis || []).forEach(e => {
    const m = emu(e);
    const btn = document.createElement('button');
    btn.className = 'gcfg-emoji' + (_prEmojiSel === m ? ' sel' : '');
    btn.title = ':' + e.name + ':';
    btn.onclick = () => { _prEmojiSel = m; renderPrEmojiGrid(); };
    const img = document.createElement('img');
    img.src = 'https://cdn.discordapp.com/emojis/' + e.id + '.' + (e.animated ? 'gif' : 'png') + '?size=48';
    btn.appendChild(img); g.appendChild(btn);
  });
  if (!(_cfgMeta.emojis || []).length) g.innerHTML = '<span class="sm" style="padding:8px">Server chưa có emoji.</span>';
  if (_prUniOk) { prUniPaint(); return; }
  u.innerHTML = '<span class="pr-uni-note">Đang tải bộ emoji Unicode đầy đủ (~1.900 emoji)…</span>';
  prUniScript().then(function (ok) {
    if (!document.getElementById('pr_emojiUni')) return; // người dùng đã đổi thẻ
    if (!ok) {
      // Không tải được bộ đầy đủ → dùng ngay 60 emoji cơ bản đặt trong trang (vẫn chọn được)
      window.EMOJI_ROWS = PR_UNICODE.map(x => [x, x, 0]);
      window.EMOJI_GROUP_NAMES = [[0, 'Cơ bản (tải ngoại tuyến)']];
      _prUniGroup = 0; _prUniOk = true;
      prUniPaint();
      showToast('Không tải được bộ emoji đầy đủ — tạm dùng bộ cơ bản.', false);
      return;
    }
    prUniPaint();
  });
}
function prAddItem() {
  if (!_cfgEditable) return;
  collectPickrole();
  const r = document.getElementById('pr_roleSel').value;
  if (!r) { showToast('Chọn 1 role.', false); return; }
  const rr = cfgRole(r);
  if (!rr || rr.managed === true) { showToast('Role hệ thống/integration không gán được — chọn role khác.', false); return; }
  if (!_prEmojiSel) { showToast('Chọn 1 emoji.', false); return; }
  if (_cfg.pickrole.items.some(x => x.roleId === r)) { showToast('Role này đã có trong danh sách.', false); return; }
  _cfg.pickrole.items.push({ roleId: r, emoji: _prEmojiSel });
  _prEmojiSel = '';
  gcfgRender();
  markDirty();
}
function prItemDel(id) {
  if (!_cfgEditable) return;
  collectPickrole();
  _cfg.pickrole.items = _cfg.pickrole.items.filter(x => x.roleId !== id);
  gcfgRender();
  markDirty();
}
function collectPickrole() {
  if (!_cfg || !_cfg.pickrole) return;
  const p = _cfg.pickrole; const g = id => document.getElementById(id);
  if (g('pr_enabled')) p.enabled = g('pr_enabled').checked;
  if (g('pr_title')) p.title = g('pr_title').value;
  if (g('pr_content')) p.content = g('pr_content').value;
  if (g('pr_mode')) p.mode = g('pr_mode').value;
}
/* (đã bỏ nút/hàm Lưu Pickrole — lưu qua thanh cảnh báo) */


// ─── Khởi động ───
(function () {
  // Đưa dòng báo lỗi đăng nhập ra ngoài dropdown (dropdown cũ đã ẩn).
  const wrap = document.querySelector('.login-wrap');
  const err = document.getElementById('loginErr');
  if (wrap && err && err.parentNode !== wrap) wrap.appendChild(err);

renderAccounts();
handleAuth();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && _cfgDirty) askLeave();
});

// Tự làm mới danh sách server (im lặng): định kỳ 45s và mỗi khi quay lại tab.
// Nhờ vậy thẻ server mà bot đã bị kick tự biến mất mà không cần bấm gì.

dl('Redirect URI (phải khai báo y hệt trong Discord Developer Portal → OAuth2 → Redirects): ' + REDIRECT);
