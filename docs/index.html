<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Bảo mật: chặn script/ảnh/kết nối từ nguồn lạ. Bỏ dòng này nếu trang lỗi hiển thị. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self' https://discord.com https://clowo-locks.clowo.workers.dev; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<title>Clowo — Bot Discord đa năng</title>
<style>
:root{
  color-scheme:dark;
  --blur:#5865f2;
  --blur2:#8b93ff;
  --bg:#05070f;
  --panel:rgba(12,16,30,.86);
  --panel2:rgba(21,27,50,.72);
  --txt:#e8ecf7;
  --mut:#94a1bd;
  --line:rgba(255,255,255,.11);
  --glass:rgba(16,21,40,.6);
  --glass-strong:rgba(12,16,30,.92);
  --ok:#3ddc97;
  --err:#ff6b70;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
  color:var(--txt);
  background:var(--bg);
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed;inset:0;z-index:-2;
  background:url('clowobackground.png') center/cover fixed no-repeat, url('assets/clowobackground.png') center/cover fixed no-repeat, url('assets/hero.png') center/cover fixed no-repeat;
  filter:saturate(1.05);
  transition:transform .5s ease,filter .5s ease;
}
body.auth::before{transform:scale(1.06);filter:saturate(1.05) blur(3px)}
body::after{
  content:'';
  position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(5,7,15,.5) 0%,rgba(5,7,15,.68) 55%,rgba(5,7,15,.86) 100%);
  transition:background .5s ease;
}
body.auth::after{background:linear-gradient(180deg,rgba(5,7,15,.8) 0%,rgba(5,7,15,.88) 60%,rgba(5,7,15,.95) 100%)}
a{text-decoration:none}

/* ─── Landing ─── */
.hero{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
  gap:26px;
}
.login-wrap{position:relative;margin-top:10px}

.login-btn{
  font-family:inherit;cursor:pointer;font-size:1.05rem;font-weight:800;
  color:#fff;border:1px solid rgba(139,147,255,.55);
  border-radius:16px;padding:17px 64px;letter-spacing:.4px;
  background:linear-gradient(135deg,#5865f2,#3d47ad);
  box-shadow:0 18px 48px rgba(88,101,242,.35);
  transition:transform .18s,box-shadow .18s,filter .18s;
}
.login-btn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.08);box-shadow:0 24px 60px rgba(88,101,242,.45)}
.login-btn:active{transform:scale(.97)}

.dd{
  position:absolute;top:calc(100% + 12px);left:50%;
  width:340px;max-width:92vw;
  border-radius:18px;padding:12px;
  background:var(--glass-strong);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 26px 60px rgba(0,0,0,.22);
  opacity:0;visibility:hidden;transform:translateX(-50%) translateY(-10px) scale(.97);
  transition:opacity .22s,transform .22s,visibility .22s;
  z-index:50;
  text-align:left;
}
.dd.open{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1)}
.dd-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:6px 8px 8px}
.acct-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  transition:background .15s;
}
.acct-row:hover{background:rgba(30,31,36,.05)}
.acct-row img{width:38px;height:38px;border-radius:50%;background:#eee}
.acct-meta{flex:1;min-width:0}
.acct-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-sub{font-size:.72rem;color:var(--mut)}
.unlink-btn{
  cursor:pointer;border:none;background:transparent;color:var(--mut);
  font-size:.72rem;padding:5px 8px;border-radius:8px;transition:all .15s;
}
.unlink-btn:hover{background:rgba(239,68,68,.12);color:#ef4444}
.link-btn{
  cursor:pointer;width:100%;margin-top:8px;border:none;border-radius:12px;
  padding:12px;font-family:inherit;font-size:.92rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#5865f2,#3f4ac0);
  box-shadow:0 8px 20px rgba(88,101,242,.4);
  transition:transform .16s,box-shadow .16s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.link-btn:hover{transform:translateY(-1px)}
.link-btn.danger{background:linear-gradient(135deg,#e5484d,#b32a2f);box-shadow:0 8px 20px rgba(229,72,77,.32);font-size:.8rem;padding:10px}
.dd-opt{display:flex;align-items:center;gap:8px;padding:8px 6px 2px;font-size:.76rem;color:var(--mut);cursor:pointer;line-height:1.3}
.login-err{font-size:.78rem;color:#ef4444;padding:2px 8px;display:none}
.dd-empty{padding:16px;text-align:center;color:var(--mut);font-size:.86rem}
.dd-head{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:8px 8px 6px;margin-top:4px}
.guild-row{display:flex;align-items:center;gap:10px}
.hero-foot{position:absolute;bottom:18px;font-size:.78rem;color:rgba(232,236,247,.5)}

/* ─── Views ─── */
.view{position:relative}
.view.active{animation:viewIn .45s cubic-bezier(.22,1,.36,1) both}
.view.active>*{animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both}
.view.active>*:nth-child(1){animation-delay:.04s}
.view.active>*:nth-child(2){animation-delay:.12s}
.view.active>*:nth-child(3){animation-delay:.2s}
.view.active>*:nth-child(4){animation-delay:.28s}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ─── Panel điều khiển: các thẻ rời ở góc trên trái ─── */
.panel{
  position:fixed;top:14px;left:14px;z-index:300;
  display:flex;flex-direction:row;gap:12px;align-items:stretch;
  max-height:calc(100vh - 28px);color:var(--txt);
}
.panel[hidden]{display:none}
.panel [hidden]{display:none!important}
/* mỗi khối là một thẻ tách rời, tự có nền/viền/bo góc/đổ bóng */
.pcard{
  border-radius:18px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 18px 46px rgba(0,0,0,.5);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.pcard::-webkit-scrollbar{width:9px}
.pcard::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.panel-nav{
  flex:none;width:282px;min-width:0;display:flex;flex-direction:column;gap:10px;
  max-height:calc(100vh - 28px);overflow-y:auto;scrollbar-width:thin;
}
.panel-nav::-webkit-scrollbar{width:9px}
.panel-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.panel.wide{right:14px;width:auto}
.panel.wide .panel-nav{height:calc(100vh - 28px)}
.panel.wide .gcfg{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;height:calc(100vh - 28px);max-height:calc(100vh - 28px)}
.panel.wide .gcfg-body{max-height:none;flex:1;min-height:0}
.panel-head{display:flex;align-items:center;gap:6px;padding:8px}
.acct-card{
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;
  font-family:inherit;font-size:.9rem;font-weight:700;color:var(--txt);
  background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 10px;
  transition:border-color .16s,background .16s;
}
.acct-card:hover{background:rgba(255,255,255,.05)}
.acct-card img{width:30px;height:30px;border-radius:50%;background:#242c4d;flex:none;object-fit:cover}
.acct-card .acct-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.acct-card .caret{font-size:.7em;color:var(--mut);transition:transform .2s}
.acct-card.open .caret{transform:rotate(180deg)}
.panel-x{
  flex:none;cursor:pointer;font-family:inherit;color:var(--mut);font-size:.82rem;font-weight:700;
  background:transparent;border:1px solid transparent;border-radius:11px;padding:9px 10px;
  transition:color .15s,background .16s;
}
.panel-x:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.panel-accts{display:flex;flex-direction:column;gap:2px;padding:8px}
.panel-sec{display:flex;flex-direction:column;gap:4px;padding:10px}
.panel-sec-head{display:flex;align-items:center;justify-content:space-between;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:2px 6px 6px}
.panel-sec .link-btn{margin-top:8px}
/* ─── Hàng tab ngang: 5 tùy chỉnh nằm ở đầu bảng tùy chỉnh ─── */
.gcfg-tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.gcfg-tabs::-webkit-scrollbar{display:none}
.gcfg-tab{cursor:pointer;flex:none;font-family:inherit;font-size:.78rem;font-weight:700;color:var(--mut);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:8px 13px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.gcfg-tab:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.gcfg-tab.active{background:rgba(88,101,242,.24);color:#fff;border-color:rgba(88,101,242,.55)}
.dd-title{display:flex;align-items:center;justify-content:space-between}
.mini-btn{
  cursor:pointer;border:none;background:rgba(88,101,242,.12);color:var(--blur);
  width:26px;height:26px;border-radius:8px;font-size:.9rem;line-height:1;font-family:inherit;
  transition:all .2s;
}
.mini-btn:hover{transform:rotate(180deg);background:rgba(88,101,242,.2)}
.acct-row,.guild-row{cursor:pointer;transition:background .15s,transform .15s}
.guild-row{border-radius:16px;padding:10px 12px}
.acct-row:active,.guild-row:active{transform:scale(.98)}
.acct-row.active,.guild-row.active{background:rgba(88,101,242,.13);box-shadow:inset 0 0 0 1px rgba(88,101,242,.3)}
.g-ico{width:38px;height:38px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:var(--mut);flex:none}
.g-img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none}

/* ├── micro-animations ── */
.link-btn:active{transform:scale(.96)}
.unlink-btn:active{transform:scale(.9)}

label{display:block;text-align:left;font-size:.76rem;color:var(--mut);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input{
  width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.75);color:var(--txt);font-size:.9rem;margin-bottom:14px;
  outline:none;transition:border .2s;font-family:inherit;
}
input:focus{border-color:var(--blur)}
input::placeholder{color:#9aa0ab}
button{font-family:inherit}

@media (max-width:560px){
  .f-item{flex-direction:column;gap:2px}
  .f-name{min-width:0}
  .dd{width:310px}
  .chip{max-width:165px}
}

/* ─── Cấu hình server (tab lớn kế bên cột danh sách) ─── */
.gcfg{display:none;flex-direction:column;min-width:0;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 46px rgba(0,0,0,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow:hidden}
.gcfg.open{display:flex}
.gcfg-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);gap:8px}
.gcfg-guild{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.84rem;min-width:0;word-break:break-word;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.gcfg-guild .g-img,.gcfg-guild .g-ico{width:24px;height:24px;font-size:.7rem}
.gcfg-head .right{display:flex;align-items:center;gap:8px;flex:none}
.gcfg-head-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.gcfg-head-guild{font-size:.86rem;font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcfg-head-guild:empty{display:none}
.gcfg-head-guild:not(:empty)::after{content:'·';margin-left:8px;color:var(--mut);font-weight:400}
.gcfg-head h3{white-space:nowrap;flex:none}
.gcfg-hint{font-size:.68rem;color:var(--mut)}
.gcfg-hint.err{color:var(--err)}
.gcfg-hint.ok{color:var(--ok)}
.gcfg-head h3{font-size:.92rem}
.gcfg-body{padding:10px 14px 18px;overflow-y:auto;max-height:52vh}
.gcfg-loading{padding:34px;text-align:center;color:var(--mut)}
.gcfg label{display:block;text-align:left;font-size:.72rem;color:var(--mut);margin:14px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.gcfg input[type=text],.gcfg input[type=number],.gcfg textarea,.gcfg select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.8);color:var(--txt);font-size:.86rem;font-family:inherit;outline:none;transition:border .2s}
.gcfg input:focus,.gcfg textarea:focus,.gcfg select:focus{border-color:var(--blur)}
.gcfg textarea{min-height:72px;resize:vertical;line-height:1.45}
.gcfg select[multiple]{padding:6px}
.gcfg input[type=color]{width:56px;height:36px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff;vertical-align:middle}
.gcfg .sm{font-size:.72rem;color:var(--mut);text-transform:none;letter-spacing:0;font-weight:500;margin-top:6px;line-height:1.5}
.gcfg-chk{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600;text-transform:none;letter-spacing:0}
.gcfg-chk input{width:auto}
.gcfg-chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0;min-height:8px}
.gcfg-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(88,101,242,.12);border:1px solid rgba(88,101,242,.25);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600}
.gcfg-chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.gcfg-chip button{border:none;background:transparent;cursor:pointer;color:var(--mut);font-size:.82rem;padding:0 2px}
.gcfg-actions{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.gcfg-actions .link-btn{width:auto;padding:11px 24px;margin:0;display:inline-flex}
/* ─── Light polish (GĐ4) ─── */
.gcfg-actions .link-btn{background:linear-gradient(135deg,#5865f2,#4e5bd4);color:#fff;border:none;border-radius:12px;box-shadow:0 8px 20px rgba(88,101,242,.28);transition:transform .15s,box-shadow .15s}
.gcfg-actions .link-btn:hover{transform:translateY(-1px);box-shadow:0 11px 26px rgba(88,101,242,.38)}
.gcfg-head h3{background:linear-gradient(120deg,#3f4ac0,#9c27b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.gcfg-body::-webkit-scrollbar, .rpk::-webkit-scrollbar{width:10px;height:10px}
.gcfg-body::-webkit-scrollbar-thumb, .rpk::-webkit-scrollbar-thumb{background:rgba(30,31,36,.14);border-radius:99px;border:2px solid transparent;background-clip:content-box}
.gcfg-body::-webkit-scrollbar-thumb:hover, .rpk::-webkit-scrollbar-thumb:hover{background:rgba(30,31,36,.28);background-clip:content-box}
.gcfg input:disabled,.gcfg select:disabled,.gcfg textarea:disabled{opacity:.55;cursor:not-allowed}
.gcfg button:disabled{opacity:.55;cursor:not-allowed}
/* ─── Welcome builder + role picker + selects ─── */
.wprev{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 32px rgba(30,31,36,.10)}
.wprev canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.wprev canvas.dragging{cursor:grabbing}
.wbg-row{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
.wfile-btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.82rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#5865f2,#3f4ac0);border-radius:10px;padding:9px 14px;box-shadow:0 6px 14px rgba(88,101,242,.35);transition:transform .15s,box-shadow .15s}
.wfile-btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(88,101,242,.42)}
.wlink{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:10px;padding:9px 14px;font-size:.82rem;font-weight:700;color:var(--txt);transition:all .15s}
.wlink:hover{border-color:#ef4444;color:#ef4444}
.wshape-label{display:block;margin:12px 0 6px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.pill-group{display:flex;gap:8px;flex-wrap:wrap}
.pill{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:999px;padding:7px 16px;font-size:.82rem;font-weight:700;color:var(--mut);transition:all .16s}
.pill:hover{border-color:var(--blur);color:var(--blur)}
.pill.on{background:linear-gradient(135deg,#5865f2,#3f4ac0);color:#fff;border-color:transparent;box-shadow:0 5px 12px rgba(88,101,242,.35)}
/* ─── Welcome: nền (kéo/zoom) + ô văn bản ─── */
.wtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.wt-btn{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:10px;padding:8px 13px;font-size:.79rem;font-weight:700;color:var(--txt);font-family:inherit;transition:all .15s}
.wt-btn:hover{border-color:var(--blur);color:var(--blur)}
.wt-btn.danger:hover{border-color:#ef4444;color:#ef4444}
.wzoom{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.wzoom input[type=range]{flex:1;accent-color:#5865f2;height:22px}
.wzoom b{font-size:.74rem;color:var(--mut);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.wtexts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.wtext-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:rgba(255,255,255,.72);cursor:pointer;transition:all .15s}
.wtext-item:hover{border-color:var(--blur)}
.wtext-item.on{border-color:#5865f2;box-shadow:0 0 0 3px rgba(88,101,242,.14)}
.wtext-item .wt-label{flex:1;min-width:0;font-size:.8rem;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtext-item .wt-del{border:none;background:transparent;cursor:pointer;color:#ef4444;font-weight:800;font-size:.95rem;line-height:1;padding:2px 4px}
.wtedit{border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-top:10px;background:rgba(246,247,251,.75)}
.wt-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:9px}
.wt-row>label{margin:0;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.wt-row input[type=number]{width:78px}
.wt-row input[type=color]{width:48px;padding:2px;height:36px}
.wt-row select{width:auto;min-width:110px}
.wt-tgl{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:9px;padding:6px 11px;font-size:.76rem;font-weight:700;color:var(--mut);font-family:inherit;transition:all .15s}
.wt-tgl.on{background:linear-gradient(135deg,#5865f2,#3f4ac0);color:#fff;border-color:transparent}
.save-state{font-size:.72rem;font-weight:700;white-space:nowrap}
.save-state.ok{color:#2fb472}
.save-state.err{color:#e5484d}
.save-state.busy{color:var(--mut)}
.rpk{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:rgba(255,255,255,.7)}
.rpk-search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.85);margin-bottom:6px;font-size:.82rem;font-family:inherit;outline:none}
.rpk-search:focus{border-color:var(--blur)}
.rpk .pk{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;transition:background .13s}
.rpk .pk:hover{background:rgba(30,31,36,.04)}
.rpk .pk.on{background:rgba(88,101,242,.10)}

<script>

(function () {

// ─── Chặn DevTools (F12, Ctrl+Shift+I/J/C/U/K/E, F7, chuột phải, phát hiện dock + debugger) ───
(function () {

const CLIENT_ID = '1507978908224454747';
// Redirect URI phải KHỚP TUYỆT ĐỐI với mục Discord Developer Portal → OAuth2 → Redirects.
// Trên GitHub Pages luôn dùng đúng MỘT chuỗi duy nhất (có "/" cuối), dù người dùng mở

const REDIRECT = (location.hostname === 'minhtu446.github.io')

const LS_KEY = 'clowo_accounts';
const LS_ACT = 'clowo_active_acc';
const LS_OAUTH = 'clowo_oauth_state';
const LS_PKCE = 'clowo_oauth_verifier';
const LS_ACCS = 'clowo_accounts_v2';
const LS_ACTIVE = 'clowo_active_v2';
const WORKER = 'https://clowo-locks.clowo.workers.dev';

// ─── Tài khoản đã liên kết được LƯU ở localStorage: mở lại trang vẫn còn danh sách,
// không cần đăng nhập Discord lại. Chỉ trạng thái OAuth tạm vẫn dùng sessionStorage. ───
let _accs = [];
let _actId = null;

// ─── Nạp danh sách tài khoản + tài khoản đang chọn từ lần đăng nhập trước ───
(function () {
  try {
    const raw = localStorage.getItem(LS_ACCS);
    if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr)) _accs = arr; }
  } catch (e) { _accs = []; }
  try { _actId = localStorage.getItem(LS_ACTIVE) || null; } catch (e) {}
})();

function storeGet(k) {
  if (k === LS_ACT) return _actId;
  try { return sessionStorage.getItem(k); } catch (e) { return null; }
}
function storeSet(k, v) {
  if (k === LS_ACT) { _actId = v; try { localStorage.setItem(LS_ACTIVE, v); } catch (e) {} return; }
  try { sessionStorage.setItem(k, v); } catch (e) {}
}
function storeDel(k) {
  if (k === LS_ACT) { _actId = null; try { localStorage.removeItem(LS_ACTIVE); } catch (e) {} return; }
  try { sessionStorage.removeItem(k); } catch (e) {}
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

// ─── Dọn các key CŨ (từ phiên bản trước). Danh sách đăng nhập nay ở clowo_accounts_v2. ───
(function () {
  try {
    localStorage.removeItem(LS_KEY);
    sessionStorage.removeItem(LS_KEY);
    localStorage.removeItem(LS_ACT);
    sessionStorage.removeItem(LS_ACT);
    localStorage.removeItem('clowo_remember');
    sessionStorage.removeItem('clowo_remember');
    localStorage.removeItem('clowo_admin_key');
    sessionStorage.removeItem('clowo_admin_key');
  } catch (e) {}
})();

// ─── Server đang chọn ───
let _selGuild = null;

function getAccounts() { return _accs.slice(); }
function saveAccounts(a) {
  _accs = Array.isArray(a) ? a.slice() : [];
  try { localStorage.setItem(LS_ACCS, JSON.stringify(_accs)); } catch (e) {}
}
function activeAccount() {
  const accs = getAccounts();
  const id = storeGet(LS_ACT);
  let a = accs.find(x => x.id === id) || accs[0] || null;
  return a;
}
function activeId() {
  const a = activeAccount();
  return a ? a.id : null;
}
function setActiveAccount(id) { if (id) storeSet(LS_ACT, id); }
function setActiveGuild(id) { _selGuild = id || null; }

function avatarUrl(u) {
  if (u.avatar) return `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`;
  const idx = (BigInt(u.id) >> 22n) % 6n;
  return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
}

// ─── Điều hướng panel: thẻ acc → danh sách server → 5 tùy chỉnh → bảng tùy chỉnh ───
let _showAccts = false;   // dropdown danh sách tài khoản
let _showServers = false; // khối danh sách server
let _editorOpen = false;  // bảng tùy chỉnh hình chữ nhật bên phải
let _restoreDone = false;

function setAccts(open) {
  _showAccts = !!open;
  const el = document.getElementById('panelAccts');
  if (el) el.hidden = !open;
  const card = document.getElementById('acctCard');
  if (card) card.classList.toggle('open', !!open);
}
function setServers(show) {
  _showServers = !!show;
  const el = document.getElementById('panelSec');
  if (el) el.hidden = !show;
}
function openEditor() {
  _editorOpen = true;
  const st = document.getElementById('viewSettings');
  if (st) st.classList.add('open');
  const p = document.getElementById('panel');
  if (p) p.classList.add('wide');
  syncLeaveBar();
}
function closeEditor() {
  _editorOpen = false;
  const st = document.getElementById('viewSettings');
  if (st) st.classList.remove('open');
  const p = document.getElementById('panel');
  if (p) p.classList.remove('wide');
  syncLeaveBar();
}
function resetNav() {
  _selGuild = null; _cfg = null; _cfgSaved = null; _cfgCard = null;
  _cfgDirty = false;
  setAccts(false); setServers(false);
  closeEditor();
}
function saveLastState() {
  try {
    if (_selGuild) localStorage.setItem('clowo_last', JSON.stringify({ gid: _selGuild, card: _cfgCard || null, at: Date.now() }));
    else localStorage.removeItem('clowo_last');
  } catch (e) {}
}
function loadLastState() {
  try { const raw = localStorage.getItem('clowo_last'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function restoreLast() {
  if (_restoreDone) return;
  if (_selGuild || _showAccts || _editorOpen) { _restoreDone = true; return; }
  const a = activeAccount();
  if (!a) { _restoreDone = true; return; }
  const gu = manageableGuilds(a);
  if (!gu.length) return;
  _restoreDone = true;
  const last = loadLastState();
  if (!last || !last.gid) return;
  if (!gu.some(g => g.id === last.gid)) return;
  const card = (last.card && CFG_TITLES[last.card]) ? last.card : 'welcome';
  gcfgOpen(last.gid, card);
}

async function toggleAcct() {
  const el = document.getElementById('panelAccts');
  if (!el) return;
  setAccts(el.hidden);
}

function renderAccounts() {
  const accs = getAccounts();
  const panel = document.getElementById('panel');
  const a = activeAccount();
  if (!accs.length) {
    if (panel) panel.hidden = true;
    document.body.classList.remove('auth');
    resetNav();
    return;
  }
  if (panel) panel.hidden = false;
  document.body.classList.add('auth');
  const av = document.getElementById('acctAv');
  if (av) { av.src = a ? avatarUrl(a) : ''; av.style.display = a ? '' : 'none'; }
  const nm = document.getElementById('acctName');
  if (nm) nm.textContent = (a && a.name) || 'Chưa liên kết';
  const list = document.getElementById('panelAccts');
  if (list) {
    list.innerHTML = '';
    accs.forEach(x => {
      const row = document.createElement('div');
      row.className = 'acct-row' + (x.id === activeId() ? ' active' : '');
      row.innerHTML =
        `<img src="${avatarUrl(x)}" alt="avatar" loading="lazy">` +
        `<div class="acct-meta">` +
          `<div class="acct-name">${escapeHtml(x.name)}` +
          `</div>` +
          `<div class="acct-sub">${x.id}</div>` +
        `</div>` +
        `<button class="unlink-btn" title="Hủy liên kết" onclick="event.stopPropagation();unlinkAccount('${x.id}')">✕</button>`;
      row.onclick = async () => {
        if (x.id === activeId()) { setAccts(false); return; }
        if (_cfgDirty && !(await askLeave())) return;
        setActiveAccount(x.id);
        _selGuild = null; _cfg = null; _cfgSaved = null; _cfgCard = null; _cfgDirty = false;
        closeEditor(); setAccts(false);
        renderAccounts();
      };
      list.appendChild(row);
    });
    const link = document.createElement('button');
    link.type = 'button';
    link.className = 'link-btn';
    link.textContent = accs.length ? '+ Liên kết thêm Discord' : 'Liên kết với Discord';
    link.onclick = () => startOAuth();
    list.appendChild(link);
  }
  if (!_selGuild) { setAccts(false); setServers(true); closeEditor(); }
  renderGuildChip();
  lazyRefresh();
  restoreLast();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function unlinkAccount(id) {
  if (id === activeId() && _cfgDirty && !(await leaveGuard())) return;
  const rem = getAccounts().find(a => a.id === id);
  if (rem && rem.session) {
    try {
      await fetch(WORKER + '/session/revoke', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: rem.session })
      });
    } catch (e) {}
  }
  const wasActive = activeId() === id;
  saveAccounts(getAccounts().filter(a => a.id !== id));
  if (wasActive) {
    storeDel(LS_ACT);
    lsDel(LS_ACT);
    const first = getAccounts()[0];
    if (first) setActiveAccount(first.id);
    resetNav();
  }
  renderAccounts();
}

// ─── Quyền quản lý server (khớp cổng quyền của worker) ───
const MASK_MANAGE = 8n | 32n;
let _refreshing = false;

function manageableGuilds(a) {
  return (a && a.guilds ? a.guilds : []).filter(g => {
    if (g.permissions == null) return false;
    try { return (BigInt(String(g.permissions)) & MASK_MANAGE) !== 0n; } catch { return false; }
  });
}

function gIco(g) {
  if (g.icon) return `<img class="g-img" src="https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64" alt="" loading="lazy">`;
  const ch = (g.name || 'S').trim().charAt(0).toUpperCase() || 'S';
  return `<span class="g-ico">${escapeHtml(ch)}</span>`;
}

let _flashT = null;
function flashGuild(t) {
  const el = document.getElementById('guildEmpty');
  el.style.display = 'block';
  el.textContent = t;
  showToast(t, false);
  clearTimeout(_flashT);
  _flashT = setTimeout(renderGuildChip, 2800);
}

function showToast(text, ok) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;background:#1e1e2e;color:#e9e9f0;border:1px solid #555;border-left:4px solid #e5484d;border-radius:8px;padding:10px 16px;font:13px/1.45 Arial;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.35)';
    document.body.appendChild(el);
  }
  el.style.borderLeftColor = ok ? '#2fb472' : '#e5484d';
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.style.display = 'none'; }, 5200);
}

function dl(text) {
  const el = document.getElementById('diagLog');
  const t = new Date().toLocaleTimeString('vi-VN');
  const line = '[' + t + '] ' + text;
  if (el) { el.textContent = line + '\n' + el.textContent; }
  try {
    const arr = JSON.parse(localStorage.getItem('clowo_diag') || '[]');
    arr.unshift(line);
    localStorage.setItem('clowo_diag', JSON.stringify(arr.slice(0, 60)));
  } catch {}
}


function renderGuildChip() {
  const list = document.getElementById('guildList');
  const empty = document.getElementById('guildEmpty');
  const hint = document.getElementById('guildHint');
  const a = activeAccount();
  if (!a) {
    if (list) list.innerHTML = '';
    if (empty) { empty.style.display = 'block'; empty.textContent = 'Đăng nhập tài khoản để chọn server.'; }
    if (hint) hint.textContent = '';
    _guildsSig = '';
    return;
  }
  const gu = manageableGuilds(a);
  const sig = a.id + ':' + gu.map(g => g.id).join(',');
  if (sig === _guildsSig && list && list.firstChild) { syncGuildSel(); return; }
  _guildsSig = sig;
  if (list) {
    list.innerHTML = '';
    gu.forEach(g => appendRow(list, g));
  }
  if (empty) {
    empty.style.display = gu.length ? 'none' : 'block';
    if (!gu.length) empty.textContent = (a.guilds || []).length ? 'Không có server nào bạn quản trị.' : 'Bấm ↻ để tải danh sách server.';
  }
  if (hint) hint.textContent = gu.length ? (gu.length + ' server') : '';
  syncGuildSel();
}
function appendRow(list, g) {
  const row = document.createElement('div');
  row.className = 'guild-row' + (g.id === _selGuild ? ' active' : '');
  row.setAttribute('data-g', g.id);
  row.innerHTML = `${gIco(g)}<div class="acct-meta"><div class="acct-name">${escapeHtml(g.name)}</div></div>`;
  row.onclick = () => openGuildFlow(g.id);
  list.appendChild(row);
}
function syncGuildSel() {
  document.querySelectorAll('#guildList .guild-row').forEach(row => {
    row.classList.toggle('active', row.getAttribute('data-g') === _selGuild);
  });
}

let _guildsSig = '';
const _autoRefreshTried = {};

function lazyRefresh() {
  const a = activeAccount();
  if (!a || _refreshing) return;
  if (!a.session || (a.guilds || []).length) return;
  if (_autoRefreshTried[a.id]) return;
  _autoRefreshTried[a.id] = true;
  refreshGuilds();
}
// quiet = true: làm mới ngầm (không đổi dòng trạng thái, không báo lỗi) — dùng cho
// nhịp tự động 45s và khi quay lại tab. Danh sách server vẫn cập nhật bình thường.
async function refreshGuilds(quiet) {
  const a = activeAccount();
  const empty = document.getElementById('guildEmpty');
  if (!a) return;
  if (!a.session) {
    if (!quiet) {
      empty.style.display = 'block';
      empty.textContent = 'Phiên đăng nhập hết hạn — đăng nhập lại tài khoản để tải server.';
    }
    return;
  }
  if (_refreshing) return;
  _refreshing = true;
  if (!quiet) {
    empty.style.display = 'block';
    empty.textContent = 'Đang tải danh sách server...';
  }
  try {
    const r = await fetch(WORKER + '/guilds', {
      headers: { 'Authorization': 'Bearer ' + a.session }
    });
    if (r.status === 401 || r.status === 403) {
      if (!quiet) empty.textContent = 'Phiên đăng nhập hết hạn — đăng nhập lại tài khoản này.';
      if (r.status === 401) showRelogin('Phiên Discord đã hết hạn — đăng nhập lại để tải lại server.');
      return;
    }
    if (!r.ok) { if (!quiet) empty.textContent = 'Lỗi khi tải server.'; return; }
    const guilds = await r.json();
    const accs = getAccounts();
    const ac = accs.find(x => x.id === a.id);
    if (ac) ac.guilds = (guilds || []).map(g => ({ id: g.id, name: g.name, icon: g.icon, permissions: g.permissions }));
    saveAccounts(accs);
    renderGuildChip();
    closeGoneGuild();
  } catch {
    if (!quiet) empty.textContent = 'Không tải được server.';
  } finally { _refreshing = false; }
  renderGuildChip();
  restoreLast();
}

// Server đang mở mà không còn trong danh sách (bot đã bị kick) → đóng bảng cấu hình.
// KHÔNG xoá cấu hình đã lưu — chỉ ẩn thẻ và đóng bảng, để khi mời bot lại là dùng được ngay.
function closeGoneGuild() {
  if (!_selGuild) return;
  const a = activeAccount();
  if (manageableGuilds(a).some(g => g.id === _selGuild)) return;
  const wasOpen = _editorOpen;
  _selGuild = null; _cfg = null; _cfgSaved = null; _cfgDirty = false;
  closeEditor();
  setServers(true);
  saveLastState();
  if (wasOpen) showToast('Bot đã rời server này — đã đóng bảng cấu hình (cấu hình vẫn được giữ).', true);
}

// PKCE: code_verifier ngẫu nhiên → code_challenge = base64url(SHA-256(verifier))
function b64url(bytes) {
  let s = '';
  const b = new Uint8Array(bytes);
  for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function makePkce() {
  const a = new Uint8Array(32);
  crypto.getRandomValues(a);
  const verifier = b64url(a);
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: b64url(digest) };
}

// Đăng nhập bằng luồng Authorization Code (+PKCE) để Worker nhận được refresh_token
// → phiên không còn hết hạn sau 7 ngày như luồng implicit cũ.
//
// Trước khi chuyển hướng, hỏi Worker xem đã có DISCORD_SECRET chưa:
//  - chưa có (hoặc Worker cũ chưa có route này) → dùng luồng implicit cũ, vẫn đăng nhập được
//  - có rồi → dùng luồng code + PKCE
// Nhờ vậy KHÔNG cần đúng thứ tự deploy: đặt secret xong là panel tự dùng luồng vĩnh viễn.
async function oauthCodeReady() {
  try {
    const r = await fetch(WORKER + '/oauth/cap', { cache: 'no-store' });
    if (!r.ok) return false;
    const d = await r.json();
    return !!(d && d.code);
  } catch (e) { return false; }
}

async function startOAuth() {
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let verifier = '', challenge = '';
  if (await oauthCodeReady()) {
    try {
      const pk = await makePkce();
      verifier = pk.verifier; challenge = pk.challenge;
    } catch (e) { /* không có crypto.subtle → vẫn chạy code flow, không kèm PKCE */ }
  }
  try {
    sessionStorage.setItem(LS_OAUTH, state);
    if (verifier) sessionStorage.setItem(LS_PKCE, verifier); else sessionStorage.removeItem(LS_PKCE);
  } catch (e) {}
  let url =
    `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}` +
    `&redirect_uri=${encodeURIComponent(REDIRECT)}` +
    `&scope=${encodeURIComponent('identify guilds')}&state=${encodeURIComponent(state)}`;
  if (verifier) {
    url += `&response_type=code&code_challenge=${challenge}&code_challenge_method=S256`;
  } else {
    url += '&response_type=token';
  }
  dl('OAuth: ' + (verifier ? 'Authorization Code + PKCE' : 'implicit (worker chưa có DISCORD_SECRET)'));
  window.location.href = url;
}

// Bỏ ?code=&state= khỏi thanh địa chỉ (code chỉ dùng được 1 lần, F5 sẽ lỗi nếu còn)
function cleanAuthUrl() {
  try {
    const u = new URL(location.href);
    let changed = false;
    ['code', 'state', 'error', 'error_description'].forEach(k => {
      if (u.searchParams.has(k)) { u.searchParams.delete(k); changed = true; }
    });
    if (!changed) return;
    const q = u.searchParams.toString();
    history.replaceState(null, '', u.pathname + (q ? '?' + q : '') + u.hash);
  } catch (e) {}
}

function showLoginErr(msg) {
  const err = document.getElementById('loginErr');
  if (!err) return;
  err.style.display = 'block';
  let text = String(msg || '');
  // Lỗi kiểu OAuth/redirect thường do Redirect URI chưa khai báo khớp → hiện luôn chuỗi đang dùng
  if (/redirect|oauth|invalid|state/i.test(text)) {
    text += ` — Redirect URI đang dùng: ${REDIRECT} (phải khai báo Y HỆT trong Discord Developer Portal → OAuth2 → Redirects).`;
  }
  err.textContent = text;
}

// ─── Thanh "phiên hết hạn — đăng nhập lại" (không chặn thao tác) ───
function hideRelogin() {
  const el = document.getElementById('reloginBar');
  if (el) el.remove();
}
function reloginNow() {
  hideRelogin();
  try { startOAuth(); } catch (e) { showToast('Không mở được trang đăng nhập Discord.', false); }
}
function showRelogin(msg) {
  if (document.getElementById('reloginBar')) return;
  const b = document.createElement('div');
  b.id = 'reloginBar';
  b.className = 'relogin-bar';
  const s = document.createElement('span');
  s.textContent = msg || 'Phiên Discord đã hết hạn.';
  const btn = document.createElement('button');
  btn.className = 'relogin-go';
  btn.textContent = 'Đăng nhập lại';
  btn.onclick = reloginNow;

  x.textContent = '✕';
  x.setAttribute('aria-label', 'Đóng');
  x.onclick = hideRelogin;
  b.appendChild(s); b.appendChild(btn); b.appendChild(x);
  document.body.appendChild(b);
}

// Lưu tài khoản sau khi Worker trả về phiên (dùng chung cho cả 2 luồng)
function applySession(d) {
  const ex = getAccounts().find(a => a.id === d.uid);
  const obj = {
    id: d.uid,
    name: d.name,
    avatar: d.avatar,
    session: d.session,
    joined: ex ? ex.joined : Date.now(),
    guilds: (d.guilds || []).map(g => ({ id: g.id, name: g.name, icon: g.icon, permissions: g.permissions }))
  };
  upsertLinkedAccount(obj);
  setActiveAccount(d.uid);
  renderAccounts();
  setAccts(false);
  hideRelogin();
}

function handleAuth() {
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
  const code = q.get('code');
  const legacyToken = h.get('access_token');
  const errDesc = q.get('error_description') || h.get('error_description') || q.get('error') || h.get('error');
  if (!code && !legacyToken && !errDesc) return;

  // Xoá tham số khỏi URL trước khi xử lý (code dùng 1 lần, không để lộ trên thanh địa chỉ)
  if (location.hash) location.hash = '';
  cleanAuthUrl();

  let wantState = null, verifier = '';
  try {
    wantState = sessionStorage.getItem(LS_OAUTH); sessionStorage.removeItem(LS_OAUTH);
    verifier = sessionStorage.getItem(LS_PKCE) || ''; sessionStorage.removeItem(LS_PKCE);
  } catch (e) {}
  const gotState = q.get('state') || h.get('state');

  if (!code && !legacyToken) {
    showLoginErr(errDesc || 'Không thể đăng nhập Discord.');
    return;
  }
  if (wantState && gotState !== wantState) {
    showLoginErr('Phiên đăng nhập không hợp lệ (state) — bấm lại nút liên kết.');
    dl('OAuth state KHÔNG khớp → từ chối');
    return;
  }
  const err = document.getElementById('loginErr');
  if (err) err.style.display = 'none';

  // code → Worker đổi lấy token + refresh_token (luồng mới, phiên vĩnh viễn)
  // token → luồng cũ, để tương thích
  const path = code ? '/session/exchange' : '/session';
  const body = code
    ? { code: code, code_verifier: verifier, redirect_uri: REDIRECT }
    : { token: legacyToken };

  fetch(WORKER + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
    .then(r => r.json().then(j => ({ st: r.status, j: j })))
    .then(function (res) {
      const d = res.j;
      if (!d || !d.session) {
        showLoginErr((d && d.error) || 'Phiên đăng nhập không hợp lệ, thử lại nhé.');
        return;
      }
      applySession(d);
    })
    .catch(function () { renderAccounts(); });
}

// Đăng nhập lại tài khoản Discord (dùng khi phiên hết hạn) — Worker tạo phiên mới, trình duyệt chỉ giữ session id
function upsertLinkedAccount(obj) {
  const accs = getAccounts();
  const ex = accs.find(a => a.id === obj.id);
  if (ex) {
    Object.assign(ex, obj);
  } else {
    accs.unshift(obj);
  }
  saveAccounts(accs);
  return ex || accs[0];
}

/* handleAuth (mới) đã được định nghĩa phía trên — hỗ trợ cả ?code= và #access_token= */

// ─── Control panel (qua Cloudflare Worker — không cần PAT) ───
async function cw(path, opts) {
  const o = opts || {};
  const ln = o.method || 'GET';
  const headers = { 'Content-Type': 'application/json', ...((o && o.headers) || {}) };
  try {
    const r = await fetch(WORKER + path, { ...o, headers });
    let d = {};
    try { d = await r.json(); } catch {}
    dl(ln + ' ' + path + ' → ' + r.status + (d.error ? ' ' + d.error : ''));
    if (r.status === 401 && d && d.code === 'SESSION_EXPIRED') showRelogin('Phiên Discord đã hết hạn — đăng nhập lại để tiếp tục.');
    return { status: r.status, ...d };
  } catch (e) {
    dl(ln + ' ' + path + ' → X ' + e.message);
    return { status: 0, error: 'Không kết nối được Worker: ' + e.message };
  }
}


// ─── Cấu hình server (sidebar 5 thẻ) ───
let _cfg = null;
let _cfgMeta = { roles: [], emojis: [], members: [] };
let _cfgEditable = false;

function cfgDefaults() {
  return {
    welcome: { enabled: true, channelId: '', content: '', bgVersion: '', backgroundUrl: '', avatarSize: 130, avatarShape: 'circle', avatarX: 65, avatarY: 150, bgX: 0, bgY: 0, bgZoom: 100, texts: [], roles: [] },
    ticket: { enabled: true, categoryId: '', panel: { content: '', color: 0x5865F2 }, ticket: { content: '', color: 0x5865F2 }, allow: [] },
    voice: { enabled: true, hubChannelId: '', categoryId: '' },
    emojiRole: { enabled: true, roles: [] },
    pickrole: { enabled: true, mode: 'multi', title: '', content: '', items: [] }
  };
}
function mergeCfg(c) {
  const base = cfgDefaults();
  if (c && typeof c === 'object') {
    for (const k in base) {
      if (Array.isArray(base[k])) { if (Array.isArray(c[k])) base[k] = c[k]; }
      else if (c[k] && typeof c[k] === 'object') base[k] = Object.assign({}, base[k], c[k]);
    }
  }
  if (c && c.rev != null) base.rev = c.rev;
  return base;
}
function cfgRole(id) { return _cfgMeta.roles.find(r => r.id === id) || null; }
function cfgMember(id) { return _cfgMeta.members.find(m => m.id === id) || null; }

function cfgMemberName(id) { const m = cfgMember(id); return m ? m.name : ('user ' + id); }
function hexColor(n) { return '#' + (Number(n) || 0).toString(16).padStart(6, '0').slice(-6); }
function colorToInt(hex) { const n = parseInt(String(hex || '').replace('#', ''), 16); return Number.isFinite(n) ? n : 0x5865F2; }

/* ─── Trạng thái lưu: chỉ nút Lưu mới ghi lên server ─── */
let _cfgDirty = false;
let _cfgSaved = null;
let _cfgBusy = false;

function setSaveState(cls, txt) {
  const el = document.getElementById('saveState');
  if (el) {
    el.className = 'save-state' + (cls ? ' ' + cls : '');
    el.textContent = txt || '';
  }
  syncLeaveBar();
}
function cloneCfg(c) { try { return c ? JSON.parse(JSON.stringify(c)) : null; } catch { return null; } }
function draftKey(gid) { return 'clowo_draft:' + gid; }
function saveDraft() {
  try { localStorage.setItem(draftKey(_selGuild), JSON.stringify({ config: _cfg, rev: Number(_cfg && _cfg.rev) || 0, at: Date.now() })); } catch {}
}
function clearDraft(gid) { try { localStorage.removeItem(draftKey(gid || _selGuild)); } catch {} }
function loadDraft(gid) {
  try { const raw = localStorage.getItem(draftKey(gid)); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function markDirty() {

function collectCard() {
  if (!_cfg) return;
  if (_cfgCard === 'welcome') collectWelcome();
  else if (_cfgCard === 'ticket') collectTicket();
  else if (_cfgCard === 'voice') collectVoice();
  else if (_cfgCard === 'emojiRole') collectEmojiRole();
  else if (_cfgCard === 'pickrole') collectPickrole();

// Kiểm tra hợp lệ cho thẻ đang mở (thay cho các nút Lưu riêng từng thẻ đã bỏ).
function validateCard() {
  if (!_cfg) return false;
  if (_cfgCard === 'welcome') {
    const w = _cfg.welcome;
    if (w.enabled && !/^\d{15,20}$/.test(String(w.channelId))) { showToast('Cần chọn kênh welcome hợp lệ để bật.', false); return false; }
  } else if (_cfgCard === 'ticket') {
    const t = _cfg.ticket;
    if (t.enabled && !/^\d{15,20}$/.test(String(t.categoryId))) { showToast('Cần chọn category hợp lệ để bật ticket.', false); return false; }
  } else if (_cfgCard === 'voice') {
    const v = _cfg.voice;
    if (v.enabled) {
      if (!v.hubChannelId) { showToast('Hãy chọn kênh voice hub.', false); return false; }
      const hub = (_cfgMeta.channels || []).find(c => String(c.id) === String(v.hubChannelId));
      if (!hub) { showToast('Kênh hub đã lưu không còn tồn tại — chọn lại kênh.', false); return false; }
      if (Number(hub.type) !== 2) { showToast('Kênh hub phải là kênh thoại (voice).', false); return false; }
      if (v.categoryId) {
        const cat = (_cfgMeta.channels || []).find(c => String(c.id) === String(v.categoryId));
        if (!cat || Number(cat.type) !== 4) { showToast('Category không hợp lệ — chọn lại hoặc để trống.', false); return false; }
      }
    }
  } else if (_cfgCard === 'pickrole') {
    const p = _cfg.pickrole;
    if (p.enabled && !p.items.length) { showToast('Cần ít nhất 1 lựa chọn để bật pickrole.', false); return false; }
    // Role quyền cao chỉ CẢNH BÁO, không chặn lưu: hiện dòng nhắc trong tab
    // (xem htmlPickrole) và nhắc 1 lần sau khi lưu xong (xem doSave). Không dùng confirm().
  }
  return true;
}
// Lưu cấu hình. Không hiện popup khi thành công — chỉ báo bằng dòng trạng thái
// ("Đã lưu lúc ...") cạnh nút Lưu. Popup chỉ dùng cho lỗi/cảnh báo.
async function doSave(force) {
  const a = activeAccount();
  const hint = document.getElementById('gcfgHint');
  if (!a || !a.session) { showToast('Cần đăng nhập.', false); setSaveState('err', 'Cần đăng nhập để lưu.'); return false; }
  if (!_cfgEditable || !_cfg) return false;
  if (!force && !_cfgDirty) { setSaveState('ok', 'Đã lưu'); return true; }
  if (_cfgBusy) return false;
  _cfgBusy = true;
  collectCard();
  if (!validateCard()) { _cfgBusy = false; return false; }
  try {
    if (_cfgCard === 'welcome') {
      const ok = await flushWelcomeAssets();
      if (!ok) { _cfgDirty = true; return false; }
    }
    const highWarn = (_cfgCard === 'pickrole') ? prHighItems() : [];
    const rev = Number(_cfg.rev) || 0;
    const d = await cw('/guild/config', { method: 'POST', headers: { Authorization: 'Bearer ' + a.session }, body: JSON.stringify({ guildId: _selGuild, session: a.session, config: _cfg, rev: rev }) });
    if (d.status === 200 && d.ok) {
      _cfg.rev = Number(d.rev) || (rev + 1);
      _cfgDirty = false;
      _cfgSaved = cloneCfg(_cfg);
      clearDraft(_selGuild);
      setSaveState('ok', 'Đã lưu ' + new Date().toLocaleTimeString());
      if (hint) { hint.className = 'gcfg-hint ok'; hint.textContent = 'Đã lưu lúc ' + new Date().toLocaleTimeString(); }
      if (highWarn.length) {
        showToast(`⚠️ Đã lưu, nhưng có ${highWarn.length} lựa chọn là role quyền quản trị/quản lí — ai chọn cũng nhận quyền này.`, false);
      }
      return true;
    }
    if (d.status === 409) {
      showToast(d.error || 'Có người vừa sửa cấu hình.', false);
      if (_cfg) _cfg.rev = Number(d.rev) || 0;
      setSaveState('err', 'Người khác vừa sửa — đang tải lại');
      if (hint) { hint.className = 'gcfg-hint err'; hint.textContent = (d.error || 'Có người vừa sửa.') + ' Đang tải lại...'; }
      _cfgDirty = false;
      await gcfgLoad();
      return false;
    }
    const msg = (d && (d.error || d.message)) || 'Lưu thất bại.';
    _cfgDirty = true;
    saveDraft();
    setSaveState('err', msg);
    if (hint) { hint.className = 'gcfg-hint err'; hint.textContent = msg; }
    showToast(msg, false);
    return false;
  } catch (e) {
    _cfgDirty = true; saveDraft();
    setSaveState('err', 'Lỗi: ' + e.message);
    if (hint) { hint.className = 'gcfg-hint err'; hint.textContent = 'Lỗi: ' + e.message; }
    return false;
  } finally {
    _cfgBusy = false;
  }
}

function discardChanges() {
  if (_cfgSaved) _cfg = cloneCfg(_cfgSaved);
  _cfgDirty = false;
  clearDraft(_selGuild);
  setSaveState('', '');
  const hint = document.getElementById('gcfgHint');
  if (hint) { hint.className = 'gcfg-hint'; hint.textContent = ''; }

  return askLeave();

  if (!_cfgDirty || !_cfgEditable || !_cfg) return;

async function openGuildFlow(gid) { await gcfgOpen(gid); }

async function gcfgOpen(gid, card) {
  const a = activeAccount();
  if (!a || !a.session) { showToast('Đăng nhập tài khoản Discord trước để cấu hình.', false); return; }

  if (_selGuild && _selGuild !== gid) { if (!(await leaveGuard())) return; }
  _selGuild = gid; _cfg = null; _cfgSaved = null;
  _cfgCard = card || _cfgCard || 'welcome';
  _prEmojiSel = '';

  if (!(await leaveGuard())) return;

async function gcfgLoad() {
  const a = activeAccount(); if (!a) return;
  const hint = document.getElementById('gcfgHint');
  const d = await cw('/guild/config?guild=' + encodeURIComponent(_selGuild), { headers: { Authorization: 'Bearer ' + a.session } });
  if (d.status === 401) {
    _cfg = null; _cfgEditable = false; _cfgDirty = false;
    hint.className = 'gcfg-hint err';
    hint.innerHTML = 'Phiên Discord đã hết hạn — <a href="#" onclick="startOAuth();return false;">đăng nhập lại</a>.';
    document.getElementById('gcfgBody').innerHTML = '';
    setSaveState('', ''); syncLeaveBar();
    refreshGuilds();
    return;
  }
  if (d.status === 403) {
    _cfg = null; _cfgEditable = false; _cfgDirty = false;
    hint.className = 'gcfg-hint err';
    hint.textContent = 'Bạn không có quyền quản lý server này.';
    document.getElementById('gcfgBody').innerHTML = '';
    setSaveState('', ''); syncLeaveBar();
    refreshGuilds();
    return;
  }
  if (d.status !== 200) {
    hint.className = 'gcfg-hint err'; hint.textContent = 'Lỗi tải cấu hình (HTTP ' + d.status + ').';
    document.getElementById('gcfgBody').innerHTML = ''; return;
  }
  _cfg = mergeCfg(d.config || {});
  _cfgMeta = { roles: d.roles || [], emojis: d.emojis || [], members: d.members || [], channels: d.channels || [] };
  _cfgEditable = !!d.editable;
  _cfgDirty = false;
  _cfgSaved = cloneCfg(_cfg);
  const dr = loadDraft(_selGuild);
  if (dr && dr.config && Number(dr.rev) === Number(_cfg.rev) && _cfgEditable) {
    _cfg = mergeCfg(dr.config);
    _cfg.rev = Number(dr.rev) || 0;
    _cfgDirty = true;
    setSaveState('dirty', 'Đã phục hồi thay đổi chưa lưu');
    showToast('Đã phục hồi thay đổi chưa lưu của server này.', true);
  } else {
    if (dr) clearDraft(_selGuild);
    setSaveState('', '');
  }
  if (!_cfgEditable) { hint.className = 'gcfg-hint err'; hint.textContent = 'Bạn không có quyền quản lý server này.'; }
  else { hint.className = 'gcfg-hint'; hint.textContent = ''; }
  if (_cfgCard) gcfgRender();
}
function gcfgNav() { document.querySelectorAll('.gcfg-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-card') === _cfgCard)); }
async function gcfgShow(card) {
  if (!_selGuild) { showToast('Chọn server trước đã.', false); return; }
  if (card === _cfgCard && _editorOpen) { gcfgNav(); refreshMeta(true); return; }
  if (_cfg) collectCard();
  _cfgCard = card; gcfgNav();
  document.getElementById('gcfgTitle').textContent = CFG_TITLES[card];
  openEditor();
  gcfgRender();
  saveLastState();
  refreshMeta(true);
}
function gcfgDis() { return _cfgEditable ? '' : ' disabled'; }

function gcfgRender() {
  const b = document.getElementById('gcfgBody');
  if (!_cfg) return;
  if (_cfgCard === 'welcome') b.innerHTML = htmlWelcome();
  else if (_cfgCard === 'ticket') b.innerHTML = htmlTicket();
  else if (_cfgCard === 'voice') b.innerHTML = htmlVoice();
  else if (_cfgCard === 'emojiRole') b.innerHTML = htmlEmojiRole();
  else b.innerHTML = htmlPickrole();
  if (_cfgCard === 'ticket') renderTicketPicklist();
  if (_cfgCard === 'pickrole') renderPrEmojiGrid();
  if (_cfgCard === 'welcome') { renderRolePick('w_rolepick', 'welcome'); initWelcomePreview(); }
  if (_cfgCard === 'emojiRole') renderRolePick('er_rolepick', 'emojiRole');
  if (_cfgEditable) {
    b.oninput = (e) => {
      const t = e.target || {};
      if (t.classList && t.classList.contains('rpk-search')) return;
      if (t.id === 't_search' || t.id === 'pr_search') return;
      markDirty();
    };
    b.onchange = () => markDirty();
  } else { b.oninput = null; b.onchange = null; }
}
/* ─── Làm mới nhanh danh sách kênh & role từ server (không động vào cfg) ─── */
let _metaBusy = false;
async function refreshMeta(quiet) {
  const a = activeAccount();
  if (!_selGuild || !a || !a.session || _metaBusy) return;
  _metaBusy = true;
  try {
    const d = await cw('/guild/meta?guild=' + encodeURIComponent(_selGuild), { headers: { Authorization: 'Bearer ' + a.session } });
    if (d.status !== 200) { if (!quiet) showToast(d.error || 'Không làm mới được danh sách kênh & role.', false); return; }
    _cfgMeta = { roles: d.roles || [], emojis: d.emojis || [], members: d.members || [], channels: d.channels || [] };
    if (_cfg && d.rev != null && Number(d.rev) !== Number(_cfg.rev) && !_cfgDirty) {
      await gcfgLoad();       // cấu hình đã đổi ở nơi khác → nạp lại toàn bộ
    } else if (_cfgCard && !_cfgDirty) {
      gcfgRender();           // chỉ vẽ lại picker với kênh/role mới
    }
    if (!quiet) showToast('Đã làm mới kênh & role.', true);
  } catch (e) {
    if (!quiet) showToast('Lỗi làm mới: ' + e.message, false);
  } finally { _metaBusy = false; }
}

/* ── Welcome ── */
function chOpts(type, cur, blank) {
  const list = (_cfgMeta.channels || []).filter(c => Number(c.type) === type);
  const icon = type === 4 ? '▸' : (type === 2 ? '♪' : '#');
  let s = blank != null ? `<option value=""${cur ? '' : ' selected'}>${cfgEsc(blank)}</option>` : '';
  if (cur && !list.some(c => String(c.id) === String(cur))) s += `<option value="${cfgEsc(cur)}" selected>${icon} ${cfgEsc(cur)} (id chưa biết)</option>`;
  s += list.map(c => `<option value="${c.id}"${String(c.id) === String(cur) ? ' selected' : ''}>${icon} ${cfgEsc(c.name)}</option>`).join('');
  return s;
}
function cfgArr(key) {
  if (key === 'welcome') return _cfg.welcome.roles;
  if (key === 'emojiRole') return _cfg.emojiRole.roles;
  return (_cfg[key] || []);
}
function renderRolePick(boxId, key) {
  const box = document.getElementById(boxId); if (!box) return;
  const q = (box.dataset.q || '').toLowerCase();
  const sel = new Set(cfgArr(key) || []);
  let html = '';
  if (box.dataset.rpsearch === '1') {
    html += `<input class="rpk-search" type="text" placeholder="Tìm role..." value="${cfgEsc(box.dataset.q || '')}" oninput="rpSearch(this)">`;
  }
  const rows = _cfgMeta.roles.slice().sort((a, b) => (b.position || 0) - (a.position || 0)).filter(r => !q || r.name.toLowerCase().includes(q));
  html += rows.map(r => {
    const on = sel.has(r.id);
    const mark = key === 'emojiRole' ? (hasStartEmoji(r.name) ? '✓ ' : '· ') : '';
    return `<div class="pk${on ? ' on' : ''}" onclick="rpToggle('${key}','${r.id}')"><span class="dot" style="background:${hexColor(r.color)}"></span><span>${mark}${cfgEsc(r.name)}</span><span class="badge">${on ? '✓ chọn' : (r.managed === true ? 'hệ thống' : '')}</span></div>`;
  }).join('') || '<div class="pk" style="color:#999">Không tìm thấy role.</div>';
  box.innerHTML = html;
}
function rpSearch(input) {
  const box = input.closest('.rpk'); if (!box) return;
  box.dataset.q = input.value;
  renderRolePick(box.id, box.dataset.key);
}
function rpToggle(key, id) {
  if (!_cfgEditable) return;
  const a = cfgArr(key); const i = a.indexOf(id);
  if (i >= 0) a.splice(i, 1); else a.push(id);
  document.querySelectorAll('.rpk[data-key="' + key + '"]').forEach(b => renderRolePick(b.id, key));
  markDirty();
}

const W_TEXT_FAMS = { sans: 'sans-serif', serif: 'serif', mono: 'monospace' };
function wServerName() {
  try { const a = activeAccount(); const g = ((a && a.guilds) || []).find(x => x.id === _selGuild); return g ? g.name : 'Server'; } catch { return 'Server'; }
}
function wTextSample(txt) {
  return String(txt == null ? '' : txt)
    .replace(/\{mention\}/gi, '@bạn')
    .replace(/\{user\}/gi, 'Tên bạn')
    .replace(/\{server\}/gi, wServerName())

}
function wTextFont(t) {

}
function wTextAnchor(ctx, t) {
  const txt = wTextSample(t && t.text);
  ctx.save();
  ctx.font = wTextFont(t);
  const tw = ctx.measureText(txt).width;
  ctx.restore();
  const size = clamp(Number(t && t.size) || 28, 8, 96);
  const x = Number(t && t.x) || 450, y = Number(t && t.y) || 225;
  const align = t && t.align === 'left' ? 'left' : (t && t.align === 'right' ? 'right' : 'center');
  const left = align === 'left' ? x : (align === 'right' ? x - tw : x - tw / 2);

}
function drawWelcomeTextsPreview(ctx) {

    if (!b.txt.trim()) continue;
    ctx.save();
    ctx.font = wTextFont(t);
    ctx.textBaseline = 'top';

// Vẽ preview GIỐNG ảnh bot thật (features/welcome.js → createWelcomeCanvas).

function drawWelcomePreview() {
  const cv = document.getElementById('w_preview'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = 900, H = 450;
  cv.width = W; cv.height = H;
  ctx.clearRect(0, 0, W, H);

  /* 1) Nền gradient — bot luôn vẽ trước, rồi mới chồng ảnh nền */
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, '#0a0814'); bgGrad.addColorStop(0.3, '#100d20');
  bgGrad.addColorStop(0.6, '#1a1238'); bgGrad.addColorStop(1, '#0c091a');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  /* Ảnh nền + lớp phủ tối */
  if (_wBgImg && _wBgImg.width) {
    const z = clamp((Number(_wZoom) || 100) / 100, 0.5, 3);
    const scale = Math.max(W / _wBgImg.width, H / _wBgImg.height) * z;
    const dw = _wBgImg.width * scale, dh = _wBgImg.height * scale;
    ctx.drawImage(_wBgImg, (W - dw) / 2 + _wBgX, (H - dh) / 2 + _wBgY, dw, dh);
    ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fillRect(0, 0, W, H);

  /* 2) Vệt sáng nền */

    const grad = ctx.createRadialGradient(g[0], g[1], 10, g[0], g[1], g[2]);
    grad.addColorStop(0, g[3]); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  /* 3) Thanh màu trên/dưới */

  accentGrad.addColorStop(0.6, '#e040a0'); accentGrad.addColorStop(1, '#ff6f6f');

  for (let gx = 0; gx < W; gx += 70) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx - 30, H); ctx.stroke(); }
  for (let gy = 0; gy < H; gy += 70) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy - 30); ctx.stroke(); }
  ctx.restore();

  /* 5) Khung bo góc (nền mờ + bóng + viền) */

  ctx.shadowColor = 'rgba(88,101,242,0.15)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 6;
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.beginPath(); ctx.roundRect(30, 25, W - 60, H - 50, 28); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  /* 6) Thanh dọc màu bên trái */

  ctx.globalAlpha = 0.3;
  const lGrad = ctx.createLinearGradient(30, 25, 30, H - 25);
  lGrad.addColorStop(0, '#5865F2'); lGrad.addColorStop(0.5, '#e040a0'); lGrad.addColorStop(1, '#5865F2');
  ctx.fillStyle = lGrad;

    const ringGrad = ctx.createLinearGradient(x, y, x + size, y + size);

  const nameW = Math.min(ctx.measureText(nameUp).width, Math.max(0, maxTextWidth));
  ctx.save();
  ctx.shadowColor = 'rgba(88,101,242,0.3)'; ctx.shadowBlur = 10;
  ctx.fillStyle = accentGrad;
  ctx.fillRect(textX, centerY - 20, nameW, 2);
  ctx.restore();

  ctx.font = '15px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('@' + String(_wSample.user || 'ten_ban').toLowerCase(), textX, centerY + 6);

  const infoY = centerY + 45;
  [['member', '#' + _wSample.count], ['id', String(_wSample.id)]].forEach((it, i) => {
    const ix = textX + i * 190;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath(); ctx.roundRect(ix, infoY - 2, 175, 52, 10); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = '10px sans-serif'; ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left'; ctx.fillText(it[0].toUpperCase(), ix + 14, infoY + 20);

function bindWelcomeDrag(cv) {
  cv.onwheel = (e) => {
    if (!_cfgEditable || !_wBgImg || !_wBgImg.width) return;
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const px = (e.clientX - r.left) * (900 / r.width);
    const py = (e.clientY - r.top) * (450 / r.height);
    const bw = _wBgImg.width, bh = _wBgImg.height;
    const baseScale = Math.max(900 / bw, 450 / bh);
    const dwB = bw * baseScale, dhB = bh * baseScale;
    const oldZ = clamp((Number(_wZoom) || 100) / 100, 0.5, 3);
    const newZ = clamp(oldZ * (e.deltaY < 0 ? 1.08 : 1 / 1.08), 0.5, 3);
    if (Math.abs(newZ - oldZ) < 0.0001) return;
    const u = (px - (900 - dwB * oldZ) / 2 - _wBgX) / (dwB * oldZ);
    const v = (py - (450 - dhB * oldZ) / 2 - _wBgY) / (dhB * oldZ);
    _wZoom = Math.round(newZ * 100);
    _wBgX = Math.round(clamp(px - (900 - dwB * newZ) / 2 - u * dwB * newZ, -2000, 2000));
    _wBgY = Math.round(clamp(py - (450 - dhB * newZ) / 2 - v * dhB * newZ, -2000, 2000));
    syncWZoomUi();
    drawWelcomePreview();
    markDirty();
  };
  cv.onpointerdown = (e) => {
    if (!_cfgEditable) { cv.onpointermove = null; return; }
    const r = cv.getBoundingClientRect();
    const px = (e.clientX - r.left) * (900 / r.width);
    const py = (e.clientY - r.top) * (450 / r.height);
    const a = _wAv;
    const hx = a.x + a.s, hy = a.y + a.s;
    const onHandle = Math.hypot(px - hx, py - hy) <= 18;
    const inAvatar = px >= a.x - 12 && px <= a.x + a.s + 12 && py >= a.y - 12 && py <= a.y + a.s + 12;
    let hit = null;
    if (!onHandle && !inAvatar) {
      const ctx = cv.getContext('2d');
      for (let i = _wTexts.length - 1; i >= 0; i--) {
        const t = _wTexts[i];
        const b = wTextAnchor(ctx, t);
        if (!b.txt.trim()) continue;
        if (px >= b.left - 6 && px <= b.left + b.w + 6 && py >= b.top - 6 && py <= b.top + b.h + 6) { hit = t; break; }
      }
    }
    const mode = onHandle ? 'resize' : (inAvatar ? 'move' : (hit ? 'text' : 'pan'));
    if (mode === 'pan' && !(_wBgImg && _wBgImg.width)) return;
    if (hit && _wSelText !== hit.id) { _wSelText = hit.id; renderWTextPanel(); }
    cv.setPointerCapture(e.pointerId);
    cv.classList.add('dragging');
    const base = { ax: a.x, ay: a.y, as: a.s, px, py, tx: hit ? Number(hit.x) || 0 : 0, ty: hit ? Number(hit.y) || 0 : 0, bx: _wBgX, by: _wBgY };
    const onMove = (ev) => {
      const rr = cv.getBoundingClientRect();
      const qx = (ev.clientX - rr.left) * (900 / rr.width);
      const qy = (ev.clientY - rr.top) * (450 / rr.height);
      if (mode === 'move') {
        a.x = clamp(base.ax + qx - base.px, 10, 900 - a.s - 10);
        a.y = clamp(base.ay + qy - base.py, 10, 450 - a.s - 10);
      } else if (mode === 'resize') {
        a.s = clamp(Math.round(base.as + Math.max(qx - base.px, qy - base.py)), 60, Math.min(400, 900 - a.x - 10, 450 - a.y - 10));
      } else if (mode === 'text' && hit) {
        hit.x = Math.round(clamp(base.tx + qx - base.px, -100, 1200));
        hit.y = Math.round(clamp(base.ty + qy - base.py, -100, 700));
      } else if (mode === 'pan') {
        _wBgX = Math.round(clamp(base.bx + qx - base.px, -2000, 2000));
        _wBgY = Math.round(clamp(base.by + qy - base.py, -2000, 2000));

      cv.onpointermove = null; cv.onpointerup = null; cv.onpointercancel = null;

    };
    cv.onpointermove = onMove;
    cv.onpointerup = onUp;
    cv.onpointercancel = onUp;

// Chuyển Blob → data URL (dùng cho preview + lúc upload).
function blobToDataUrl(blob) {
  return new Promise((resolve) => {
    if (!blob) { resolve(null); return; }
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => resolve(null);
    fr.readAsDataURL(blob);
  });
}

// Nén ảnh nền trước khi tải lên: cạnh dài tối đa 1920px, WebP 0.85 (JPEG dự phòng).
// Ảnh gốc có thể tới 17MB; sau nén thường chỉ còn vài trăm KB nên tải nhanh hơn hẳn.
const BG_MAX_DIM = 1920;
function compressImage(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, BG_MAX_DIM / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const finish = (dataUrl) => { URL.revokeObjectURL(url); resolve(dataUrl); };
        cv.toBlob((blob) => {
          // Trình duyệt không hỗ trợ WebP sẽ trả về PNG → mã hoá lại thành JPEG.
          if (blob && blob.type === 'image/webp') { blobToDataUrl(blob).then(finish); return; }
          cv.toBlob((jpg) => { blobToDataUrl(jpg || blob).then(finish); }, 'image/jpeg', 0.85);
        }, 'image/webp', 0.85);
      } catch (e) {
        URL.revokeObjectURL(url);
        resolve(null);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

  <div class="gcfg-actions"><button class="link-btn" onclick="prAddItem()"${d}>＋ Thêm lựa chọn</button></div>`;
}
function renderPrEmojiGrid() {
  const g = document.getElementById('pr_emojiGrid'); const u = document.getElementById('pr_emojiUni'); if (!g || !u) return;
  g.innerHTML = ''; u.innerHTML = '';
  (_cfgMeta.emojis || []).forEach(e => {
    const m = emu(e);
    const btn = document.createElement('button');
    btn.className = 'gcfg-emoji' + (_prEmojiSel === m ? ' sel' : '');
    btn.title = ':' + e.name + ':';
    btn.onclick = () => { _prEmojiSel = m; renderPrEmojiGrid(); };
    const img = document.createElement('img');
    img.src = 'https://cdn.discordapp.com/emojis/' + e.id + '.' + (e.animated ? 'gif' : 'png') + '?size=48';
    btn.appendChild(img); g.appendChild(btn);
  });
  if (!(_cfgMeta.emojis || []).length) g.innerHTML = '<span class="sm" style="padding:8px">Server chưa có emoji.</span>';
  PR_UNICODE.forEach(x => {
    const btn = document.createElement('button');
    btn.className = 'gcfg-emoji' + (_prEmojiSel === x ? ' sel' : '');
    btn.textContent = x;
    btn.onclick = () => { _prEmojiSel = x; renderPrEmojiGrid(); };
    u.appendChild(btn);
  });
}
function prAddItem() {
  if (!_cfgEditable) return;
  collectPickrole();
  const r = document.getElementById('pr_roleSel').value;
  if (!r) { showToast('Chọn 1 role.', false); return; }
  const rr = cfgRole(r);
  if (!rr || rr.managed === true) { showToast('Role hệ thống/integration không gán được — chọn role khác.', false); return; }
  if (!_prEmojiSel) { showToast('Chọn 1 emoji.', false); return; }
  if (_cfg.pickrole.items.some(x => x.roleId === r)) { showToast('Role này đã có trong danh sách.', false); return; }
  _cfg.pickrole.items.push({ roleId: r, emoji: _prEmojiSel });
  _prEmojiSel = '';
  gcfgRender();
  markDirty();
}
function prItemDel(id) {
  if (!_cfgEditable) return;
  collectPickrole();
  _cfg.pickrole.items = _cfg.pickrole.items.filter(x => x.roleId !== id);
  gcfgRender();
  markDirty();
}
function collectPickrole() {
  if (!_cfg || !_cfg.pickrole) return;
  const p = _cfg.pickrole; const g = id => document.getElementById(id);
  if (g('pr_enabled')) p.enabled = g('pr_enabled').checked;
  if (g('pr_title')) p.title = g('pr_title').value;
  if (g('pr_content')) p.content = g('pr_content').value;
  if (g('pr_mode')) p.mode = g('pr_mode').value;
}
